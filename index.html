function normErrlog(el){
  if(!el || typeof el!=='object') el=defaultErrlog();
  if(!Array.isArray(el.subjects)) el.subjects=defaultErrlog().subjects;
  if(!Array.isArray(el.entries)) el.entries=[];
  if(!el.mastery) el.mastery=2;
  el.subjects.forEach(function(s,i){ if(!Array.isArray(s.topics)) s.topics=[]; if(s.hue===undefined||s.hue===null) s.hue=i%10; });
  el.entries.forEach(function(e){
    ['stimulus','question','mine','correct','notes'].forEach(function(k){ if(!Array.isArray(e[k])) e[k]=[]; });
    if(!Array.isArray(e.attempts)) e.attempts=[];
  });
  return el;
}
function elSub(id){ return S.errlog.subjects.find(function(s){ return s.id===id; })||null; }
function elTopic(sub,tid){ return (sub&&tid)? (sub.topics.find(function(t){ return t.id===tid; })||null) : null; }
function topicHue(sub,t){ return (t&&t.hue!==undefined&&t.hue!==null)? t.hue : (sub? sub.hue : 0); }
function subsFor(curr){ return S.errlog.subjects.filter(function(s){ return s.curr===curr; }); }
function entryById(id){ return S.errlog.entries.find(function(e){ return e.id===id; })||null; }
function entriesInCurr(curr){ return S.errlog.entries.filter(function(e){ var s=elSub(e.subjectId); return s&&s.curr===curr; }); }
function blocksText(bl){ return (bl||[]).filter(function(b){ return b.t!=='image'; }).map(function(b){ return b.v||''; }).join(' '); }
function blocksEmpty(bl){ return !(bl||[]).some(function(b){ return b.t==='image'? !!b.media : !!String(b.v||'').trim(); }); }
function entryMediaIds(e){
  var ids=[];
  SECS.forEach(function(sc){ (e[sc.k]||[]).forEach(function(b){ if(b.t==='image'&&b.media) ids.push(b.media); }); });
  return ids;
}
function referencedMediaIds(){
  var m={};
  ((S.errlog&&S.errlog.entries)||[]).forEach(function(e){ entryMediaIds(e).forEach(function(id){ m[id]=1; }); });
  return m;
}
function entrySearchText(e){
  var s=elSub(e.subjectId), t=elTopic(s,e.topicId);
  return [s&&s.name, t&&t.name, e.source, e.errorType].concat(SECS.map(function(sc){ return blocksText(e[sc.k]); })).join(' ').toLowerCase();
}
function wrongCount(e){ return (e.attempts||[]).filter(function(a){ return !a.ok; }).length; }
function statusPass(e,status){ return status==='all' || (status==='mastered'? !!e.mastered : !e.mastered); }
function topicPass(e,s,topic){
  if(!topic||topic==='all') return true;
  if(topic==='none') return !elTopic(s,e.topicId);
  return e.topicId===topic;
}
function filteredEntries(){
  var f=S.ui.el, q=(f.q||'').trim().toLowerCase();
  return S.errlog.entries.filter(function(e){
    var s=elSub(e.subjectId);
    if(!s||s.curr!==f.curr) return false;
    if(f.sub!=='all' && e.subjectId!==f.sub) return false;
    if(f.sub!=='all' && !topicPass(e,s,f.topic)) return false;
    if(!statusPass(e,f.status)) return false;
    if(q && entrySearchText(e).indexOf(q)<0) return false;
    return true;
  });
}
/* A right answer counts once per day toward mastery; a wrong answer resets the streak. */
function applyResult(e,ok){
  var today=todayStr(), became=false;
  e.attempts=(e.attempts||[]).concat([{at:new Date().toISOString(),ok:!!ok}]).slice(-40);
  if(ok){
    if(e.lastOk!==today){ e.streak=(e.streak||0)+1; e.lastOk=today; }
    if(!e.mastered && e.streak>=(S.errlog.mastery||2)){ e.mastered=true; e.masteredAt=new Date().toISOString(); became=true; }
  }else{
    e.streak=0; e.lastOk=null; e.mastered=false; e.masteredAt=null;
  }
  return became;
}
function relDay(iso){
  if(!iso) return '';
  var d=new Date(iso); d.setHours(0,0,0,0);
  var n=Math.round((todayMid()-d)/864e5);
  if(n<=0) return 'today'; if(n===1) return 'yesterday'; if(n<7) return n+' days ago';
  return d.toLocaleDateString(undefined,{day:'numeric',month:'short'});
}

/* ================= error log: rendering helpers ================= */
function blocksHTML(bl,opts){
  opts=opts||{};
  return (bl||[]).map(function(b){
    if(b.t==='image'){
      if(!b.media) return '';
      return '<figure class="b-img"><img data-media="'+esc(b.media)+'" alt="Image" data-action="zoom"'+(b.w? ' width="'+b.w+'" height="'+b.h+'"':'')+'></figure>';
    }
    var v=String(b.v||''); if(!v.trim()) return '';
    return b.t==='math'? texHTML(v,true) : richHTML(v);
  }).join('');
}
function secView(e,k,extraCls,label){
  var sc=SECS.find(function(x){ return x.k===k; });
  if(blocksEmpty(e[k])) return '';
  return '<section class="esec '+sc.cls+' '+(extraCls||'')+'"><div class="esec-label">'+esc(label||sc.label)+'</div><div class="ebox rich">'+blocksHTML(e[k])+'</div></section>';
}
function masteryDots(e){
  var n=S.errlog.mastery||2, on=e.mastered? n : Math.min(e.streak||0,n), h='';
  for(var i=0;i<n;i++) h+='<i class="'+(i<on?'on':'')+'"></i>';
  return '<span class="dots" title="'+(e.mastered?'Mastered':on+' of '+n+' days correct')+'">'+h+'</span>';
}
function statusText(e){
  if(e.mastered) return '<span class="mastered-tag">Mastered</span>';
  var a=e.attempts||[];
  if(!a.length) return 'Not drilled yet';
  var last=a[a.length-1];
  return 'Last drilled '+relDay(last.at)+(last.ok? ', right':', wrong');
}
function entryPreview(e){
  var pool=(e.question||[]).concat(e.stimulus||[]);
  var tb=pool.find(function(b){ return b.t!=='image' && String(b.v||'').trim(); });
  var ib=pool.find(function(b){ return b.t==='image' && b.media; });
  var text= tb? '<div class="ptext rich">'+(tb.t==='math'? texHTML(tb.v,false) : richHTML(tb.v,true))+'</div>'
              : '<div class="ptext muted">'+(ib? 'Question saved as an image' : 'No question text')+'</div>';
  var thumb= ib? '<div class="pthumb"><img data-media="'+esc(ib.media)+'" alt=""></div>' : '';
  return '<div class="preview">'+text+thumb+'</div>';
}
function ecardHTML(e,showTopic){
  var s=elSub(e.subjectId), t=elTopic(s,e.topicId), chips='';
  if(showTopic && t) chips+='<span class="chip hc '+hcls(topicHue(s,t))+'">'+esc(t.name)+'</span>';
  if(e.source) chips+='<span class="src">'+esc(e.source)+'</span>';
  if(e.marks) chips+='<span class="chip num">'+esc(e.marks)+' mk</span>';
  if(blocksEmpty(e.correct)) chips+='<span class="chip tint-warn">No answer yet</span>';
  return '<article class="card ecard hrail lift '+hcls(s?s.hue:0)+(e.mastered?' done':'')+'" data-action="el-open" data-id="'+e.id+'" data-k="e-'+e.id+'" tabindex="0">'+
    (chips? '<div class="chips">'+chips+'</div>':'')+
    entryPreview(e)+
    '<div class="efoot">'+masteryDots(e)+'<span class="st">'+statusText(e)+'</span><span class="grow"></span>'+
      (e.errorType? '<span class="chip">'+esc(e.errorType)+'</span>':'')+
      '<span>'+esc(relDay(e.created))+'</span></div>'+
  '</article>';
}

/* ================= error log: log view ================= */
function viewLog(){
  var f=S.ui.el, subs=subsFor(f.curr);
  if(f.sub!=='all' && !subs.some(function(s){ return s.id===f.sub; })){ f.sub='all'; f.topic='all'; }
  var all=entriesInCurr(f.curr);
  var nAct=all.filter(function(e){ return !e.mastered; }).length;
  var list=filteredEntries();
  var canDrill=list.length>0;
  var h='<div class="panel-head"><div><div class="eyebrow">Error log</div><h2>Mistakes</h2>'+
    '<p class="sub">'+nAct+' to drill &middot; '+(all.length-nAct)+' mastered</p></div>'+
    '<div class="head-actions">'+(canDrill? '<button class="btn" data-action="el-drill-filter">Drill these</button>':'')+
    '<button class="btn primary" data-action="el-new">'+ICON.plus+' Log</button></div></div>';
  h+=segHTML('el-curr',CURRS,f.curr,'el-curr','v');
  var base=all.filter(function(e){ return statusPass(e,f.status); });
  h+='<div class="chiprow" role="tablist" aria-label="Subjects">'+
    '<button class="fchip '+(f.sub==='all'?'on':'')+'" data-action="el-sub" data-v="all">All subjects <span class="n">'+base.length+'</span></button>'+
    subs.map(function(s){
      var n=base.filter(function(e){ return e.subjectId===s.id; }).length;
      return '<button class="fchip '+hcls(s.hue)+(f.sub===s.id?' on':'')+'" data-action="el-sub" data-v="'+s.id+'"><span class="dot"></span><span class="lbl">'+esc(s.name)+'</span> <span class="n">'+n+'</span></button>';
    }).join('')+'</div>';
  if(f.sub!=='all'){
    var s=elSub(f.sub), inSub=base.filter(function(e){ return e.subjectId===s.id; });
    var topics=s.topics.filter(function(t){ return t.id===f.topic || inSub.some(function(e){ return e.topicId===t.id; }); });
    var none=inSub.filter(function(e){ return !elTopic(s,e.topicId); }).length;
    if(topics.length || none){
      h+='<div class="chiprow" aria-label="Topics"><button class="fchip small '+hcls(s.hue)+(f.topic==='all'?' on':'')+'" data-action="el-topic" data-v="all">All topics</button>'+
        topics.map(function(t){
          var n=inSub.filter(function(e){ return e.topicId===t.id; }).length;
          return '<button class="fchip small '+hcls(topicHue(s,t))+(f.topic===t.id?' on':'')+'" data-action="el-topic" data-v="'+t.id+'"><span class="dot"></span><span class="lbl">'+esc(t.name)+'</span> <span class="n">'+n+'</span></button>';
        }).join('')+
        (none? '<button class="fchip small '+(f.topic==='none'?'on':'')+'" data-action="el-topic" data-v="none">No topic <span class="n">'+none+'</span></button>':'')+
      '</div>';
    }
  }
  h+=segHTML('el-status',[
    {v:'active',label:'To drill',n:all.filter(function(e){ return !e.mastered; }).length},
    {v:'mastered',label:'Mastered',n:all.filter(function(e){ return e.mastered; }).length},
    {v:'all',label:'All',n:all.length}],f.status,'el-status','v');
  h+='<div class="search">'+ICON.search+'<input type="search" id="el-search" placeholder="Search questions, answers, sources" value="'+esc(f.q)+'" autocomplete="off"></div>';
  h+='<div id="el-list">'+logListHTML()+'</div>';
  return h;
}
function logListHTML(){
  var f=S.ui.el, list=filteredEntries();
  if(!list.length){
    if(!entriesInCurr(f.curr).length){
      return '<div class="empty"><b>No mistakes logged for '+(f.curr==='AL'?'A Levels':'HSC')+' yet.</b><br>When you lose marks on a past paper or test question, log the question, what you wrote and the correct answer. Then drill it until it sticks.<br><button class="btn primary" data-action="el-new">'+ICON.plus+' Log your first mistake</button></div>';
    }
    return '<div class="empty"><b>Nothing matches.</b><br>Try another subject, topic or status, or clear the search.</div>';
  }
  list.sort(function(a,b){ return String(b.created||'').localeCompare(String(a.created||'')); });
  var groups=[];
  if(f.sub==='all'){
    subsFor(f.curr).forEach(function(s){
      var items=list.filter(function(e){ return e.subjectId===s.id; });
      if(items.length) groups.push({label:s.name,hue:s.hue,items:items,topic:true});
    });
  }else{
    var s=elSub(f.sub);
    s.topics.forEach(function(t){
      var items=list.filter(function(e){ return e.topicId===t.id; });
      if(items.length) groups.push({label:t.name,hue:topicHue(s,t),items:items,topic:false});
    });
    var none=list.filter(function(e){ return !elTopic(s,e.topicId); });
    if(none.length) groups.push({label:'No topic',hue:s.hue,items:none,topic:false});
  }
  return groups.map(function(g){
    return '<div class="divider-label '+hcls(g.hue)+'"><span class="dot"></span><span class="lbl">'+esc(g.label)+'</span> <span class="num">'+g.items.length+'</span></div>'+
      '<div class="stack">'+g.items.map(function(e){ return ecardHTML(e,g.topic); }).join('')+'</div>';
  }).join('');
}
function refreshLogList(){
  var el=document.getElementById('el-list'); if(!el) return;
  mqRelease(el); el.innerHTML=logListHTML(); hydrateMedia(el); mqApply(el);
}

/* ================= error log: detail ================= */
function openDetail(id){
  var e=entryById(id); if(!e) return;
  var s=elSub(e.subjectId), t=elTopic(s,e.topicId), hue=s?s.hue:0;
  var meta='<span class="chip hc '+hcls(hue)+'">'+esc(s?s.name:'No subject')+'</span>'+
    (t? '<span class="chip hc soft '+hcls(topicHue(s,t))+'">'+esc(t.name)+'</span>':'')+
    (e.marks? '<span class="chip num">'+esc(e.marks)+' marks</span>':'')+
    (e.errorType? '<span class="chip">'+esc(e.errorType)+'</span>':'')+
    (e.mastered? '<span class="chip tint-ok">Mastered</span>' : '<span class="chip">'+masteryDots(e)+' '+Math.min(e.streak||0,S.errlog.mastery)+' of '+S.errlog.mastery+' days</span>')+
    '<span class="chip">Logged '+esc(relDay(e.created))+'</span>';
  var hist=(e.attempts||[]).length? '<section class="esec"><div class="esec-label">Drill history</div><div class="history">'+
    e.attempts.map(function(a){ return '<i class="'+(a.ok?'ok':'')+'" title="'+esc(new Date(a.at).toLocaleString())+(a.ok?' right':' wrong')+'"></i>'; }).join('')+'</div></section>' : '';
  openModal(
    '<div class="sheet-head '+hcls(hue)+'"><h3>'+esc(e.source||(t&&t.name)||(s&&s.name)||'Mistake')+'</h3>'+
      '<button class="icon-btn" data-action="close-modal" aria-label="Close">'+ICON.x+'</button></div>'+
    '<div class="sheet-body '+hcls(hue)+'"><div class="detail-meta">'+meta+'</div>'+
      secView(e,'stimulus')+secView(e,'question')+secView(e,'mine')+secView(e,'correct')+
      (blocksEmpty(e.correct)? '<p class="hint" style="margin:0 0 16px">No correct answer recorded yet. Edit this mistake to add it.</p>':'')+
      secView(e,'notes')+hist+'</div>'+
    '<div class="sheet-foot"><button class="btn ghost danger-ghost" data-action="el-del" data-id="'+e.id+'">Delete</button><span class="grow"></span>'+
      (e.mastered? '<button class="btn" data-action="el-reopen" data-id="'+e.id+'">Drill again</button>':'')+
      '<button class="btn" data-action="el-edit" data-id="'+e.id+'">Edit</button>'+
      '<button class="btn primary" data-action="el-drill-one" data-id="'+e.id+'">Drill</button></div>',
    {cls:'wide',noFocus:true});
  hydrateMedia($('#modal-root'));
}
function deleteEntry(id){
  var e=entryById(id); if(!e) return;
  if(!confirm('Delete this mistake? This cannot be undone.')) return;
  entryMediaIds(e).forEach(function(mid){ Media.del(mid); deleteRemoteMedia(mid); });
  S.errlog.entries=S.errlog.entries.filter(function(x){ return x.id!==id; });
  if(DRILL){ DRILL.queue=DRILL.queue.filter(function(q){ return q!==id; }); if(!DRILL.queue.length) DRILL.done=true; }
  save('e'); closeModal(true); render(); toast('Mistake deleted');
}

/* ================= error log: editor ================= */
var ED=null, imgTarget=null;
function newBlock(t,v){ return {id:uid(),t:t,v:v||''}; }
function openEditor(entry){
  var f=S.ui.el, isNew=!entry, draft;
  if(isNew){
    var subs=subsFor(f.curr);
    draft={id:uid(), subjectId: f.sub!=='all'? f.sub : (subs[0]? subs[0].id : ''),
      topicId: (f.sub!=='all' && f.topic!=='all' && f.topic!=='none')? f.topic : '',
      source:'', marks:'', errorType:'', created:null,
      stimulus:[], question:[newBlock('text')], mine:[newBlock('text')], correct:[newBlock('text')], notes:[newBlock('text')],
      streak:0, lastOk:null, mastered:false, attempts:[]};
  }else{
    draft=JSON.parse(JSON.stringify(entry));
    ['question','mine','correct','notes'].forEach(function(k){ if(!draft[k].length) draft[k].push(newBlock('text')); });
  }
  ED={draft:draft,isNew:isNew,orig:entry? JSON.parse(JSON.stringify(entry)) : null,created:[],dirty:false,focus:'question',saved:false,showStim:draft.stimulus.length>0,newBlk:null};
  openModal(editorHTML(),{cls:'wide',noFocus:true,guard:edGuard,onClose:edCleanup});
  edAfter();
}
function edGuard(){ return !ED || !ED.dirty || confirm('Discard your changes to this mistake?'); }
function edCleanup(){
  if(ED && !ED.saved){
    var keep=ED.orig? entryMediaIds(ED.orig) : [];
    ED.created.forEach(function(id){ if(keep.indexOf(id)<0) Media.del(id); });
  }
  ED=null;
}
function subjectOptions(cur){

var DRILL=null;
function orderPool(list){
  var o=S.ui.drillOrder||'oldest'; list=list.slice();
  if(o==='shuffle'){ for(var i=list.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=list[i]; list[i]=list[j]; list[j]=t; } }
  else if(o==='weakest') list.sort(function(a,b){ return wrongCount(b)-wrongCount(a) || (a.streak||0)-(b.streak||0); });
  else list.sort(function(a,b){ return String(a.created||'').localeCompare(String(b.created||'')); });
  return list;
}
function startDrill(list,label){

  if(became) toast('Mastered. That one is off your list.');

/* ================= scrolling text =================
   Only text that genuinely overflows its box animates. A duplicate copy follows
   the original so the loop is seamless; the copy is hidden from screen readers.
   Animations pause off-screen, keep their place across re-renders, and are
   skipped entirely when the system asks for reduced motion. */
var MQ_SEL='.title-row h3,.quick-row h3,.rem-row h3,.rem-row .rname,.sub-row .sname,.klass .kt,.chip:not(.due-chip),.fchip .lbl,.divider-label .lbl,.mini .mt b,.mini .mt>span,.sheet-head h3,.scope-card b,.scope-card>span,.ecard .src,.efoot .st,.launch h2,.greet h1,.panel-head h2';

catch(e){ mqFade=/already/i.test(String(e&&e.message)); }
try{ mqReduce=!!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches); }catch(e){}
try{
  if('IntersectionObserver' in window) mqIO=new IntersectionObserver(function(es){
    es.forEach(function(en){ (en.target._mq||[]).forEach(function(a){ try{ if(en.isIntersecting) a.play(); else a.pause(); }catch(err){} }); });
  });
}catch(e){ mqIO=null; }
function mqKey(el,text){ return el.tagName+'|'+text; }
function mqRelease(root){
  if(!root) return;
  root.querySelectorAll('.mq-on').forEach(function(el){
    var an=el._mq||[], a=el.querySelector('.mq-a');
    if(an[0] && a){ try{ mqMemo[mqKey(el,a.textContent)]=an[0].currentTime; }catch(e){} }
    an.forEach(function(x){ try{ x.cancel(); }catch(e){} });
    if(mqIO) mqIO.unobserve(el);
    el._mq=null;
  });
}
function mqUnwrap(el){
  var tr=el.querySelector('.mq-track'); if(!tr) return;
  var a=tr.firstChild; while(a.firstChild) el.insertBefore(a.firstChild,tr);
  el.removeChild(tr); el.classList.remove('mq-on','mq-still');
}
function mqApply(root){
  if(!root) return;
  var todo=[];
  root.querySelectorAll(MQ_SEL).forEach(function(el){
    if(el.classList.contains('mq-on') || el.closest('.mq-track')) return;
    if(el.clientWidth>0 && el.scrollWidth>el.clientWidth+2) todo.push(el);
  });

}
function mqWrap(el){
  var text=el.textContent, fs=parseFloat(getComputedStyle(el).fontSize)||14, gap=Math.round(fs*2.6);
  var tr=document.createElement('span'), a=document.createElement('span');
  tr.className='mq-track'; a.className='mq-a';
  while(el.firstChild) a.appendChild(el.firstChild);
  tr.appendChild(a); el.appendChild(tr); el.classList.add('mq-on');
  if(mqReduce || typeof tr.animate!=='function'){ el.classList.add('mq-still'); return; }
  var b=a.cloneNode(true); b.className='mq-a mq-clone'; b.setAttribute('aria-hidden','true'); b.style.paddingLeft=gap+'px';
  b.querySelectorAll('[id]').forEach(function(n){ n.removeAttribute('id'); });
  tr.appendChild(b);
  var D=a.offsetWidth+gap;
  var travel=Math.max(2600,D/MQ_SPEED*1000), total=MQ_HOLD+travel, p=MQ_HOLD/total, fi=(1-p)*0.07;
  var memo=mqMemo[mqKey(el,text)];
  var opts={duration:total,iterations:Infinity,delay: memo!=null? 0 : Math.round(350+Math.random()*1200)};
  var anims=[tr.animate([
    {transform:'translateX(0)',offset:0},
    {transform:'translateX(0)',offset:p,easing:'cubic-bezier(.5,0,.28,1)'},
    {transform:'translateX('+(-D)+'px)',offset:1}],opts)];
  if(mqFade){
    try{ anims.push(el.animate([{'--mq-l':'0px',offset:0},{'--mq-l':'0px',offset:p},{'--mq-l':'16px',offset:p+fi},{'--mq-l':'16px',offset:1-fi},{'--mq-l':'0px',offset:1}],opts)); }catch(e){}
  }
  if(memo!=null) anims.forEach(function(x){ try{ x.currentTime=memo; }catch(e){} });

}
var mqResizeT=null, mqLastW=window.innerWidth;
window.addEventListener('resize',function(){
  clearTimeout(mqResizeT);
  mqResizeT=setTimeout(function(){
    if(window.innerWidth===mqLastW) return; /* ignore height-only changes, e.g. the mobile keyboard */
    mqLastW=window.innerWidth;
    ['#view','#modal-root'].forEach(function(sel){ var r=$(sel); if(!r) return; mqRelease(r); r.querySelectorAll('.mq-on').forEach(mqUnwrap); mqApply(r); });

/* ================= routing & render ================= */
var PLANNER_TABS=[{v:'assignments',label:'Assignments',badge:'overdue-badge'},{v:'daily',label:'Daily'},{v:'tasks',label:'Tasks'},{v:'grades',label:'Grades'}];
var ERR_TABS=[{v:'log',label:'Log'},{v:'drill',label:'Drill',badge:'drill-badge'},{v:'subjects',label:'Subjects'}];
function parseRoute(){
  var p=(location.hash||'').replace(/^#\/?/,'').split('/'), app=p[0], sub=p[1]||'';
  if(app==='planner'){ if(!PLANNER_TABS.some(function(t){ return t.v===sub; })) sub=S.ui.tab||'assignments'; return {app:'planner',tab:sub}; }
  if(app==='errors'){ if(!ERR_TABS.some(function(t){ return t.v===sub; })) sub=S.ui.etab||'log'; return {app:'errors',tab:sub}; }
  return {app:'home'};
}
function applyRoute(){
  var r=parseRoute();
  S.ui.app=r.app;
  if(r.app==='planner') S.ui.tab=r.tab; else if(r.app==='errors') S.ui.etab=r.tab;
  save('ui'); render();
}
function go(to){ var h='#'+to; if(location.hash===h) applyRoute(); else location.hash=h; }
function routeKey(){ return S.ui.app==='planner'? 'planner/'+S.ui.tab : S.ui.app==='errors'? 'errors/'+S.ui.etab : 'home'; }
var lastRoute='';
function renderChrome(){
  var app=S.ui.app;
  document.body.setAttribute('data-app',app);
  var hb=$('#home-btn'); if(hb) hb.hidden= app==='home';
  var cr=$('#crumb'); if(cr) cr.textContent= app==='planner'? 'Planner' : app==='errors'? 'Error Log' : '';
  var tabs=$('#tabs'); if(!tabs) return;
  if(app==='home'){ tabs.hidden=true; tabs.dataset.app=''; return; }
  tabs.hidden=false;
  var defs= app==='planner'? PLANNER_TABS : ERR_TABS, cur= app==='planner'? S.ui.tab : S.ui.etab, fresh=false;
  if(tabs.dataset.app!==app){
    tabs.innerHTML=defs.map(function(d){
      return '<button role="tab" data-action="go" data-to="'+app+'/'+d.v+'" data-tabv="'+d.v+'">'+esc(d.label)+
        (d.badge? ' <span class="badge'+(d.badge==='drill-badge'?' soft':'')+'" id="'+d.badge+'" style="display:none"></span>':'')+'</button>';
    }).join('');
    tabs.dataset.app=app; tabs.style.setProperty('--n',defs.length); tabs.classList.add('no-anim'); fresh=true;
  }
  var idx=0;
  [].forEach.call(tabs.children,function(b,i){ var on=b.dataset.tabv===cur; b.classList.toggle('active',on); b.setAttribute('aria-selected',String(on)); if(on) idx=i; });
  tabs.style.setProperty('--i',idx);
  if(fresh){ void tabs.offsetWidth; tabs.classList.remove('no-anim'); }
}
function viewFor(){
  if(S.ui.app==='home') return viewHome();
  if(S.ui.app==='errors') return S.ui.etab==='drill'? viewDrill() : S.ui.etab==='subjects'? viewElSubjects() : viewLog();
  return S.ui.tab==='tasks'? viewTasks() : S.ui.tab==='grades'? viewGrades() : S.ui.tab==='daily'? viewDaily() : viewAssignments();
}
function render(){
  renderChrome();
  updateHud();
  var v=$('#view'), key=routeKey(), entering= key!==lastRoute;
  var first= entering? null : flipSnapshot(v);
  mqRelease(v);
  v.classList.remove('view-enter');
  v.innerHTML=viewFor();

    void v.offsetWidth; v.classList.add('view-enter');
    if(lastRoute){ try{ window.scrollTo(0,0); }catch(e){} }
  }else flipPlay(v,first);
  lastRoute=key;
  hydrateMedia(v);

  mqApply(v);

}
function updateHud(){

/* ================= live countdowns =================
   Ticks once a second but only touches text that actually changed,
   so it never re-renders the view or steals focus from an input. */
function findDated(id){
  return S.assignments.find(function(x){return x.id===id;}) || S.tasks.find(function(x){return x.id===id;});
}
function msToMidnight(now){ var m=new Date(now); m.setHours(24,0,0,0); return m-now; }
function resetText(now){ var p=cdParts(msToMidnight(now)); return p.h+'h '+pad2(p.m)+'m'; }
function tickCountdowns(){
  if(document.hidden) return;
  if(S.daily && S.daily.lastReset!==todayStr()){ if(checkDailyReset()){ render(); return; } }
  var now=Date.now(), statusMoved=false;
  document.querySelectorAll('[data-cd]').forEach(function(el){
    var it=findDated(el.dataset.cd); if(!it) return;
    var i=countdownInfo(it,now);
    if(el.textContent!==i.t) el.textContent=i.t;
    var cls='chip due-chip '+i.c;
    if(el.className.trim()!==cls.trim()){
      el.className=cls; statusMoved=true;
      var card=el.closest('[data-cdcard]');
      if(card){ var keep=card.className.replace(/\b(s-late|s-today|s-soon|done)\b/g,'').trim(); card.className=(keep+' '+statusClass(it,now)).trim(); }
    }
  });
  var rs=document.getElementById('daily-reset');
  if(rs){ var rt=resetText(now); if(rs.textContent!==rt) rs.textContent=rt; }
  if(statusMoved) updateHud();
}

function upsertItem(o){

/* Sync merges two sections independently: the planner (everything except the
   error log) and the error log, each by its own timestamp. Editing the planner
   on one device and the error log on another no longer overwrites either. */
/* Planner timestamp. New versions stamp pAt on planner edits and errlog.at on
   error log edits, and set updatedAt to whichever is newest. Older versions only
   bump updatedAt, so an updatedAt newer than both stamps means an older version
   edited the planner afterwards. */
function planStamp(d){
  var p=d.pAt||'', e=(d.errlog&&d.errlog.at)||'', u=d.updatedAt||'';
  return (u>p && u>e)? u : p;

function mergeProfiles(local,cloud){
  var lp=planStamp(local), cp=planStamp(cloud);
  var le=(local.errlog&&local.errlog.at)||'', ce=(cloud.errlog&&cloud.errlog.at)||'';
  var cloudP= cp>lp, cloudE= !!cloud.errlog && ce>le;
  var src= cloudP? cloud : local, out={};
  Object.keys(src).forEach(function(k){ if(k!=='errlog' && k!=='ui') out[k]=src[k]; });
  out.ui=local.ui;
  out.errlog= cloudE? cloud.errlog : local.errlog;
  out.pAt= cloudP? cp : (lp||null);
  out.updatedAt=[cp,lp,ce,le].sort().pop()||null;
  return {data:out, adopt:cloudP||cloudE, push:(!cloudP && lp>cp) || (!cloudE && le>ce)};
}

  syncing=true; lastSyncAt=Date.now(); setSyncStatus('Syncing');
  return pullCloud().then(function(rows){
    var row=rows&&rows[0];

/* ---------- images: Supabase Storage (bucket "orbit-media", one folder per user) ---------- */
var MEDIA_BUCKET='orbit-media';
var mediaState={state:'',msg:'',pending:0}, remoteTried={};
function authedFetch(url,opts,retried){
  var s=getSession(); if(!s) return Promise.reject(new Error('Not signed in'));
  opts=opts||{};
  var h={'apikey':SYNC_CONFIG.anonKey,'Authorization':'Bearer '+s.access_token};
  Object.keys(opts.headers||{}).forEach(function(k){ h[k]=opts.headers[k]; });
  var o={}; Object.keys(opts).forEach(function(k){ o[k]=opts[k]; }); o.headers=h;
  return fetch(url,o).then(function(r){
    if(r.status===401 && !retried){
      return refreshSession().then(function(ok){
        if(!ok) throw new Error('Session expired, sign in again');
        return authedFetch(url,opts,true);
      });
    }
    return r;
  });
}
function mediaPath(id){ var s=getSession(); return (s&&s.user)? s.user.id+'/'+id : null; }
function mediaUrl(id,read){ return SYNC_CONFIG.url+'/storage/v1/object/'+(read?'authenticated/':'')+MEDIA_BUCKET+'/'+mediaPath(id); }
function uploadPendingMedia(){
  if(!syncEnabled()||!getSession()||mediaState.state==='unconfigured') return Promise.resolve();
  var refs=referencedMediaIds();
  return Media.all().then(function(recs){
    var todo=recs.filter(function(r){ return !r.synced && refs[r.id] && r.blob; });
    mediaState.pending=todo.length; refreshMediaStatus();
    return todo.reduce(function(p,rec){
      return p.then(function(){
        if(mediaState.state==='unconfigured') return;
        return authedFetch(mediaUrl(rec.id),{method:'POST',headers:{'Content-Type':rec.type||'image/jpeg','x-upsert':'true'},body:rec.blob})
          .then(function(r){
            if(r.ok){ rec.synced=true; mediaState.pending=Math.max(0,mediaState.pending-1); if(mediaState.state==='error') mediaState.state=''; return Media.put(rec); }
            return r.text().then(function(t){
              if(r.status===413){ mediaState.state='error'; mediaState.msg='an image was too large to upload'; return; }
              if(r.status>=400 && r.status<500){ mediaState.state='unconfigured'; mediaState.msg=t; return; }
              mediaState.state='error'; mediaState.msg='upload failed ('+r.status+')';
            });
          });
      });
    },Promise.resolve());
  }).catch(function(){ /* offline or storage blocked: retry on next sync */ })
    .then(refreshMediaStatus);
}
function fetchRemoteMedia(id){
  if(!syncEnabled()||!getSession()||mediaState.state==='unconfigured') return Promise.resolve(null);
  if(remoteTried[id] && Date.now()-remoteTried[id]<60000) return Promise.resolve(null);
  remoteTried[id]=Date.now();
  return authedFetch(mediaUrl(id,true),{method:'GET'}).then(function(r){
    if(!r.ok) return null;
    return r.blob().then(function(b){
      return Media.put({id:id,blob:b,type:b.type||'image/jpeg',synced:true,created:new Date().toISOString()})
        .then(function(){ delete remoteTried[id]; return Media.url(id); });
    });
  }).catch(function(){ return null; });
}
function deleteRemoteMedia(id){
  if(!syncEnabled()||!getSession()||mediaState.state==='unconfigured') return;
  authedFetch(mediaUrl(id),{method:'DELETE'}).catch(function(){});
}
function mediaStatusText(){
  if(!syncEnabled()||!getSession()) return '';
  if(mediaState.state==='unconfigured') return 'Images: not syncing. The storage step in the README has not been run yet, so images stay on this device.';
  if(mediaState.state==='error') return 'Images: '+mediaState.msg+'. Will retry.';
  return mediaState.pending? 'Images: '+mediaState.pending+' waiting to upload' : 'Images: up to date';
}

      break;
    case 'expand': t.classList.toggle('open'); break;
  }
});

document.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='import-file'){ if(el.files&&el.files[0]) importData(el.files[0]); el.value=''; return; }
  if(el.id==='img-file'){ if(el.files&&el.files.length) addImages(el.files,imgTarget); el.value=''; return; }
  if(el.type==='checkbox' && el.dataset.id) justToggled=el.dataset.id;
  if(el.dataset.role==='ed-meta' && ED){
    var fld=el.dataset.field, dd=ED.draft;
    if(fld==='subjectId'){ dd.subjectId=el.value; dd.topicId=''; var ts=$('#ed-topic'); if(ts) ts.innerHTML=topicOptions(dd.subjectId,''); }
    else if(fld==='topicId' && el.value==='__new'){
      var nm=prompt('Name of the new topic'), sbj=elSub(dd.subjectId), nt=(nm&&sbj)? addTopic(sbj,nm) : null;
      if(nt){ save('e'); dd.topicId=nt.id; }
      el.innerHTML=topicOptions(dd.subjectId,dd.topicId);
    }
    else dd[fld]=el.value;
    ED.dirty=true; return;
  }
  if(el.dataset.role==='els-name'){ var sn=elSub(el.dataset.id); if(sn){ sn.name=el.value.trim()||'Untitled subject'; el.value=sn.name; save('e'); } return; }
  if(el.dataset.role==='elt-name'){
    var tn=elTopic(elSub(el.dataset.sub),el.dataset.id);
    if(tn){ if(el.value.trim()){ tn.name=el.value.trim(); save('e'); } else el.value=tn.name; }
    return;
  }
  var act=el.dataset.action, role=el.dataset.role;
  if(act==='toggle-assignment'){
    var a=S.assignments.find(function(x){return x.id===el.dataset.id;});
    if(a){ a.completed=el.checked; save(); render(); }
  }else if(act==='toggle-task'){
    var t2=S.tasks.find(function(x){return x.id===el.dataset.id;});
    if(t2){ t2.completed=el.checked; save(); render(); }
  }else if(act==='quick-toggle'){
    var q=S.quick.find(function(x){return x.id===el.dataset.id;});
    if(q){ q.done=el.checked; save(); render(); }
  }else if(act==='dsubject-toggle'){
    var dsj3=dailyFindSubject(el.dataset.id);
    if(dsj3){
      if(dsj3.subs&&dsj3.subs.length) dsj3.subs.forEach(function(x){ x.done=el.checked; });
      dsj3.done=el.checked; save(); render();
    }
  }else if(act==='dsub-toggle'){
    var dsj4=dailyFindSubject(el.dataset.sub);
    if(dsj4){
      var it=dsj4.subs.find(function(x){return x.id===el.dataset.id;});
      if(it){ it.done=el.checked; dsj4.done=dsj4.subs.every(function(x){return x.done;}); save(); render(); }
    }
  }else if(act==='rem-toggle'){
    if(el.checked) S.daily.reminderDone[el.dataset.id]=todayStr(); else delete S.daily.reminderDone[el.dataset.id];
    save(); render();
  }else if(role==='g-select'){
    var sub=S.subjects.find(function(s){return s.id===el.dataset.sub;});
    if(!sub) return;
    var row=sub.rows.find(function(r){return r.id===el.dataset.row;});
    if(!row) return;
    row.assignmentId=el.value; save();
    var w=rowWeight(row);
    var wc=document.querySelector('[data-cell="w-'+row.id+'"]');
    if(wc) wc.textContent = w===null? '-' : w;
    updateSubjectFoot(sub.id);
  }else if(role==='subject-title'){
    var s3=S.subjects.find(function(s){return s.id===el.dataset.sub;});
    if(s3){ s3.name=el.value.trim()||'Untitled subject'; el.value=s3.name; save(); }
  }
});

document.addEventListener('input',function(e){
  var el=e.target, role=el.dataset&&el.dataset.role;
  if(role==='blk-in' && ED){
    var fb=edFind(el.dataset.sec,el.dataset.blk); if(!fb) return;
    fb.b.v=el.value; ED.dirty=true; autoGrow(el);
    var pv=document.querySelector('[data-prev="'+fb.b.id+'"]');
    if(pv) pv.innerHTML= fb.b.t==='math'? (el.value.trim()? texHTML(el.value,true) : '') : (hasMath(el.value)? richHTML(el.value) : '');
    return;
  }
  if(role==='ed-meta' && ED && el.tagName==='INPUT'){ ED.draft[el.dataset.field]=el.value; ED.dirty=true; return; }
  if(el.id==='el-search'){ S.ui.el.q=el.value; save('ui'); refreshLogList(); return; }
  if(role==='drill-attempt' && DRILL){
    DRILL.attempt=el.value; autoGrow(el);
    var ap=$('#attempt-prev'); if(ap) ap.innerHTML=hasMath(el.value)? richHTML(el.value) : '';
    return;
  }
  if(role!=='g-in') return;
  var sub=S.subjects.find(function(s){return s.id===el.dataset.sub;});
  if(!sub) return;
  var row=sub.rows.find(function(r){return r.id===el.dataset.row;});
  if(!row) return;
  row[el.dataset.field]= el.value===''? null : Number(el.value);
  save();
  var p=rowPct(row);
  var pc=document.querySelector('[data-cell="p-'+row.id+'"]');
  if(pc) pc.textContent = p===null? '-' : p.toFixed(1);
  updateSubjectFoot(sub.id);
});

document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-form]');
  if(!f) return;
  e.preventDefault();
  if(f.dataset.form==='item'){
    var o=readForm(f);
    if(!o.name) return;
    closeModal();
    upsertItem(o);
  }else if(f.dataset.form==='dsubject'){
    var fd=new FormData(f);
    var name=String(fd.get('name')||'').trim(); if(!name) return;
    var curr=fd.get('curr'), list=fd.get('list')==='projects'? 'projects':'homework';
    S.daily[list].push({id:uid(),name:name,curr: curr==='both'? ['HSC','AL']:[curr],done:false,subs:[]});
    closeModal(); save(); render();
  }
});

document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){ var lb=document.querySelector('.lightbox'); if(lb){ lb.remove(); return; } closeModal(); return; }
  var tgt=e.target, typing=tgt && (/^(INPUT|TEXTAREA|SELECT)$/.test(tgt.tagName) || tgt.isContentEditable);
  if(!typing && S.ui.app==='errors' && S.ui.etab==='drill' && DRILL && !DRILL.done && !document.querySelector('#modal-root .backdrop')){
    if(!DRILL.revealed && (e.key===' '||e.key==='Enter')){ e.preventDefault(); DRILL.revealed=true; render(); return; }
    if(DRILL.revealed && (e.key==='1'||e.key==='2')){ e.preventDefault(); drillGrade(e.key==='2'); return; }
  }
  if(e.key==='Enter' && tgt && tgt.dataset && tgt.dataset.action==='el-open'){ e.preventDefault(); openDetail(tgt.dataset.id); return; }
  if(e.key==='Enter' && tgt && tgt.dataset && tgt.dataset.role==='elt-add'){
    e.preventDefault();
    var asub=elSub(tgt.dataset.sub);
    if(addTopic(asub,tgt.value)){ save('e'); render(); var again=document.querySelector('[data-role=elt-add][data-sub="'+asub.id+'"]'); if(again) again.focus(); }
    return;
  }
  if(e.key==='Enter' && e.target && e.target.id==='quick-input'){ e.preventDefault(); addQuickFromInput(); }
  if(e.key==='Enter' && e.target && e.target.id==='dtask-input'){ e.preventDefault(); addDailyTaskFromInput(); }
  if(e.key==='Enter' && e.target && e.target.dataset && e.target.dataset.role==='dsub-input'){
    e.preventDefault();
    var sj=dailyFindSubject(e.target.dataset.sub);
    var nm=e.target.value.trim();
    if(sj&&nm){
      sj.subs.push({id:uid(),name:nm,done:false});
      sj.done=sj.subs.every(function(x){return x.done;});
      save(); render();
      var ni=document.querySelector('[data-role=dsub-input][data-sub="'+sj.id+'"]');
      if(ni) ni.focus();
    }
  }
});

function addQuickFromInput(){
  var inp=$('#quick-input'); if(!inp) return;
  var name=inp.value.trim(); if(!name) return;
  S.quick.push({id:uid(),name:name,done:false});
  save(); render();
  var again=$('#quick-input'); if(again) again.focus();
}

$('#theme-btn').addEventListener('click',function(){
  S.theme = resolvedTheme()==='light' ? 'dark' : 'light';
  save('ui'); applyTheme();
});

/* screenshots: paste anywhere in the editor, or drop onto a section */
document.addEventListener('paste',function(e){
  if(!ED) return;
  var cd=e.clipboardData, files=[];
  if(cd && cd.items){ for(var i=0;i<cd.items.length;i++){ var it=cd.items[i]; if(it.kind==='file' && /^image\//.test(it.type)){ var f=it.getAsFile(); if(f) files.push(f); } } }
  if(!files.length && cd && cd.files) files=[].slice.call(cd.files).filter(function(f){ return /^image\//.test(f.type); });
  if(!files.length) return;
  e.preventDefault();
  var sec=e.target && e.target.closest && e.target.closest('.ed-sec');
  addImages(files, sec? sec.dataset.sec : ED.focus);
});
document.addEventListener('dragover',function(e){
  if(!ED) return;
  e.preventDefault();
  var sec=e.target.closest && e.target.closest('.ed-sec');
  document.querySelectorAll('.ed-sec.drag').forEach(function(x){ if(x!==sec) x.classList.remove('drag'); });
  if(sec) sec.classList.add('drag');
});
document.addEventListener('dragleave',function(e){
  var sec=e.target.closest && e.target.closest('.ed-sec');
  if(sec && !sec.contains(e.relatedTarget)) sec.classList.remove('drag');
});
document.addEventListener('drop',function(e){
  if(!ED) return;
  e.preventDefault();
  var sec=e.target.closest && e.target.closest('.ed-sec');
  document.querySelectorAll('.ed-sec.drag').forEach(function(x){ x.classList.remove('drag'); });
  if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) addImages(e.dataTransfer.files, sec? sec.dataset.sec : ED.focus);
});
document.addEventListener('focusin',function(e){
  if(!ED) return;
  var sec=e.target.closest && e.target.closest('.ed-sec');
  if(!sec) return;
  ED.focus=sec.dataset.sec;
  document.querySelectorAll('.ed-sec').forEach(function(x){ x.classList.toggle('focus',x===sec); });
});
