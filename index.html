<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orbit</title>
<meta name="description" content="Assignments, tasks, grades and an error log for past-paper mistakes. An offline-first app for students.">
<meta name="theme-color" content="#0e1424">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orbit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<style>
/* ---------- tokens ---------- */
:root{
  --r-lg:18px; --r-md:12px; --r-sm:9px;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:ui-serif,"New York","Iowan Old Style",Charter,"Source Serif Pro",Georgia,serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --spring:cubic-bezier(.2,.9,.25,1.12);
}
:root[data-theme="dark"]{
  --bg:#0d1322; --panel:#141b2e; --panel2:#1b2440; --ink:#e8edf7; --haze:#93a0b8;
  --line:#263150; --ice:#8ab6ff; --ice-ink:#0c1630;
  --late:#ff7f8a; --warn:#f2b45c; --ok:#5fd6a0; --dband:#f09761;
  --glow:rgba(138,182,255,.10); --glow2:rgba(193,155,255,.07); --shade:rgba(4,8,20,.66);
  --shadow-sm:0 1px 2px rgba(0,0,0,.28),0 1px 8px rgba(0,0,0,.18);
  --shadow-md:0 2px 6px rgba(0,0,0,.25),0 12px 32px rgba(0,0,0,.30);
  --img-bg:#f4f5f8;
}
:root[data-theme="light"]{
  --bg:#f2f4f9; --panel:#ffffff; --panel2:#ecf0f7; --ink:#131927; --haze:#59657f;
  --line:#dbe1ed; --ice:#2f5fe0; --ice-ink:#ffffff;
  --late:#c93844; --warn:#96690b; --ok:#177a52; --dband:#ad5d17;
  --glow:rgba(47,95,224,.07); --glow2:rgba(122,69,208,.05); --shade:rgba(20,26,41,.40);
  --shadow-sm:0 1px 2px rgba(20,26,41,.06),0 1px 6px rgba(20,26,41,.05);
  --shadow-md:0 2px 6px rgba(20,26,41,.06),0 14px 34px rgba(20,26,41,.10);
  --img-bg:#ffffff;
}
/* colour palette for subjects and topics: each hue tuned per theme for contrast */
:root[data-theme="dark"] .h0{--hc:#97a8ff} :root[data-theme="light"] .h0{--hc:#4255c9}
:root[data-theme="dark"] .h1{--hc:#4fd1c5} :root[data-theme="light"] .h1{--hc:#0d7a72}
:root[data-theme="dark"] .h2{--hc:#f2b45c} :root[data-theme="light"] .h2{--hc:#956006}
:root[data-theme="dark"] .h3{--hc:#ff8fa8} :root[data-theme="light"] .h3{--hc:#be3458}
:root[data-theme="dark"] .h4{--hc:#c19bff} :root[data-theme="light"] .h4{--hc:#7643cc}
:root[data-theme="dark"] .h5{--hc:#6fdc9c} :root[data-theme="light"] .h5{--hc:#187a48}
:root[data-theme="dark"] .h6{--hc:#7cc7ff} :root[data-theme="light"] .h6{--hc:#1c69a8}
:root[data-theme="dark"] .h7{--hc:#ffa36b} :root[data-theme="light"] .h7{--hc:#b0500f}
:root[data-theme="dark"] .h8{--hc:#f39ae0} :root[data-theme="light"] .h8{--hc:#a2308a}
:root[data-theme="dark"] .h9{--hc:#b9d86a} :root[data-theme="light"] .h9{--hc:#557110}

/* ---------- base ---------- */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans); color:var(--ink); background:var(--bg);
  background-image:radial-gradient(900px 480px at 82% -10%, var(--glow), transparent 62%),radial-gradient(700px 420px at -10% 10%, var(--glow2), transparent 60%);
  background-attachment:fixed;
  min-height:100vh; line-height:1.45;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  padding-bottom:calc(32px + env(safe-area-inset-bottom));
  transition:background-color .3s ease,color .3s ease;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:var(--ink)}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.02em}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
::selection{background:var(--ice);color:var(--ice-ink)}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}

/* ---------- header ---------- */
header.top{
  position:sticky;top:0;z-index:30;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:color-mix(in srgb, var(--bg) 80%, transparent);
  -webkit-backdrop-filter:blur(16px) saturate(1.2);backdrop-filter:blur(16px) saturate(1.2);
  border-bottom:1px solid var(--line);
}
.top-row{display:flex;align-items:center;gap:10px;max-width:820px;margin:0 auto}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;letter-spacing:-.02em;padding:4px 6px 4px 2px;border-radius:10px;transition:background .2s}
.brand:hover{background:var(--panel2)}
.brand svg{display:block;transition:transform .5s var(--ease)}
.brand:hover svg{transform:rotate(-30deg)}
.crumb{font-weight:600;color:var(--haze);font-size:15px;letter-spacing:-.01em}
.crumb:empty{display:none}
.crumb::before{content:"/";margin:0 7px 0 1px;color:var(--line)}
.hud{margin-left:2px;flex:1;min-width:0;text-align:right;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--haze);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .late{color:var(--late)}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--haze);border:1px solid transparent;flex:none;transition:background .18s ease,color .18s ease,transform .18s var(--ease)}
.icon-btn:hover{background:var(--panel2);color:var(--ink)}
.icon-btn:active{transform:scale(.92)}
.icon-btn:disabled{opacity:.3;cursor:default;background:none}
.badge{min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--late);color:#fff;font-family:var(--mono);font-size:10.5px;font-weight:700;display:inline-grid;place-items:center}
.badge.soft{background:color-mix(in srgb,var(--ice) 22%,transparent);color:var(--ice)}

/* ---------- segmented controls (sliding thumb) ---------- */
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:14px;isolation:isolate}
.seg::before{content:"";position:absolute;z-index:-1;top:3px;bottom:3px;left:3px;width:calc((100% - 6px) / var(--n,2));transform:translateX(calc(100% * var(--i,0)));background:var(--panel);border-radius:9px;box-shadow:var(--shadow-sm);transition:transform .38s var(--spring)}
.seg>button{padding:7px 6px;border-radius:9px;font-size:13px;font-weight:600;color:var(--haze);transition:color .2s ease;display:flex;align-items:center;justify-content:center;gap:6px;min-width:0;white-space:nowrap}
.seg>button:hover,.seg>button.active{color:var(--ink)}
.seg>button .n{font-family:var(--mono);font-size:11px;opacity:.75}
.tabs{max-width:820px;margin:10px auto 0}
.tabs.seg{margin-bottom:0}
.tabs>button{padding:8px 6px;font-size:13.5px}

/* ---------- layout ---------- */
main{max-width:820px;margin:0 auto;padding:18px 16px 8px}
.panel-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 16px}
.panel-head>div:first-child{min-width:0}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--haze);margin-bottom:5px}
.panel-head h2{font-family:var(--serif);font-size:27px;font-weight:700;letter-spacing:-.015em;line-height:1.1}
.sub{margin:4px 0 0;color:var(--haze);font-size:13px}
.stack{display:flex;flex-direction:column;gap:10px}
.divider-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--haze);margin:18px 2px 8px;display:flex;align-items:center;gap:8px}
.divider-label .dot{width:8px;height:8px;border-radius:50%;background:var(--hc)}
.head-actions{display:flex;gap:8px;flex:none}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:var(--r-md);padding:9px 15px;font-weight:650;font-size:14px;border:1px solid var(--line);background:var(--panel);transition:filter .18s ease,background .18s ease,border-color .18s ease,color .18s ease,transform .18s var(--ease),box-shadow .18s ease;white-space:nowrap}
.btn:hover{border-color:color-mix(in srgb,var(--ice) 35%,var(--line));box-shadow:var(--shadow-sm)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:none}
.btn.primary{background:var(--ice);color:var(--ice-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.07);box-shadow:0 4px 14px color-mix(in srgb,var(--ice) 35%,transparent)}
.btn.ghost{background:transparent;color:var(--haze);border-color:transparent}
.btn.ghost:hover{color:var(--ink);background:var(--panel2);box-shadow:none}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.lg{padding:12px 20px;font-size:15px;border-radius:14px}
.btn.block{width:100%}
.btn.danger-ghost{color:var(--late)}
.btn.wrong{background:color-mix(in srgb,var(--late) 12%,var(--panel));color:var(--late);border-color:color-mix(in srgb,var(--late) 34%,transparent)}
.btn.right{background:color-mix(in srgb,var(--ok) 12%,var(--panel));color:var(--ok);border-color:color-mix(in srgb,var(--ok) 34%,transparent)}
.btn.wrong:hover{border-color:var(--late)} .btn.right:hover{border-color:var(--ok)}
.kbd{font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:5px;border:1px solid currentColor;opacity:.6;font-weight:600}
@media (hover:none){.kbd{display:none}}

/* ---------- cards ---------- */
.card{
  position:relative;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:13px 14px 13px 18px;
  transition:box-shadow .25s ease,border-color .25s ease,transform .25s var(--ease),opacity .25s ease;
}
.card::before{ /* status rail: the urgency signal */
  content:"";position:absolute;left:7px;top:13px;bottom:13px;width:3px;border-radius:3px;
  background:var(--line);transition:background .3s ease;
}
@media (hover:hover){
  .card:hover{box-shadow:var(--shadow-md);border-color:color-mix(in srgb,var(--hc,var(--ice)) 30%,var(--line))}
  .card.lift:hover{transform:translateY(-2px)}
}
.card.s-late::before{background:var(--late)}
.card.s-today::before{background:var(--warn)}
.card.s-soon::before{background:var(--ice)}
.card.done{opacity:.55}
.card.done::before{background:var(--line)}
.card.hrail::before{background:var(--hc)}
.item{display:flex;gap:11px;align-items:flex-start}
.item-main{flex:1;min-width:0}
.title-row{display:flex;align-items:center;gap:8px;min-width:0}
.title-row h3{font-size:15.5px;font-weight:650;letter-spacing:-.01em}
.done .title-row h3{text-decoration:line-through;text-decoration-thickness:1.5px}
.meta{margin-top:4px;color:var(--haze);font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.meta b{color:var(--ink);font-weight:600}
.details{margin:7px 0 0;color:var(--haze);font-size:13px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.details.open{-webkit-line-clamp:unset}
.item-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.row-actions{display:flex;gap:2px;opacity:.8;transition:opacity .2s}
.card:hover .row-actions{opacity:1}
.row-actions .icon-btn{width:30px;height:30px;border-radius:8px}
.klass{display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-weight:600;max-width:100%;min-width:0}
.klass .kt{display:block}
.klass::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--hc,var(--haze))}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2.5px 8px;border-radius:999px;font-size:11px;font-weight:650;letter-spacing:.01em;background:var(--panel2);color:var(--haze);border:1px solid var(--line);white-space:nowrap;max-width:min(100%,18rem);overflow:hidden;flex:none}
.chip.tint-ice{background:color-mix(in srgb,var(--ice) 16%,transparent);color:var(--ice);border-color:color-mix(in srgb,var(--ice) 34%,transparent)}
.chip.tint-late{background:color-mix(in srgb,var(--late) 15%,transparent);color:var(--late);border-color:color-mix(in srgb,var(--late) 32%,transparent)}
.chip.tint-warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 34%,transparent)}
.chip.tint-ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 32%,transparent)}
.chip.tint-d{background:color-mix(in srgb,var(--dband) 16%,transparent);color:var(--dband);border-color:color-mix(in srgb,var(--dband) 34%,transparent)}
.chip.hc{background:color-mix(in srgb,var(--hc) 13%,transparent);color:var(--hc);border-color:color-mix(in srgb,var(--hc) 32%,transparent)}
.chip.hc.soft{background:transparent}
.due-chip{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.02em}

/* checkbox */
.tick{flex:none;padding-top:1px}
.tick input{appearance:none;-webkit-appearance:none;width:21px;height:21px;margin:0;border-radius:7px;border:1.5px solid var(--line);background:var(--panel2);display:grid;place-items:center;cursor:pointer;transition:background .18s ease,border-color .18s ease,transform .18s var(--ease)}
.tick input:hover{border-color:var(--ice)}
.tick input:checked{background:var(--ice);border-color:var(--ice)}
.tick input:checked::after{content:"";width:11px;height:11px;background:var(--ice-ink);
  -webkit-mask:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>') center/contain no-repeat;
  mask:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>') center/contain no-repeat}
.tick input.just{animation:tickpop .34s var(--spring)}
@keyframes tickpop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:none}}

/* ---------- quick tasks ---------- */
.quick-add{display:flex;gap:8px;margin-bottom:12px}
.quick-add input{flex:1}
.quick-row{padding:11px 14px 11px 16px}
.quick-row .item{align-items:center}
.quick-row h3{font-size:14.5px;font-weight:550}
.quick-row.done h3{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--haze)}

/* ---------- forms ---------- */
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],input[type=email],input[type=password],select,textarea{
  width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:9px 11px;font-size:14px;transition:border-color .18s ease,box-shadow .18s ease,background .18s ease;
}
input:focus,select:focus,textarea:focus{border-color:var(--ice);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--ice) 18%,transparent)}
textarea{resize:vertical;min-height:66px;line-height:1.5}
select{appearance:none;-webkit-appearance:none;background-image:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1l4 4 4-4" stroke="%23808ba3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>');background-repeat:no-repeat;background-position:right 11px center;padding-right:28px}
label.f{display:block;font-size:12px;font-weight:650;color:var(--haze);margin:0 0 5px;letter-spacing:.02em}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f-row.three{grid-template-columns:1fr 1fr 1fr}
.f-block{margin-bottom:13px}
input[type=date],input[type=time]{min-height:38px;-webkit-appearance:none}
.search{position:relative;margin-bottom:12px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--haze);pointer-events:none}
.search input{padding-left:34px}

/* ---------- modal ---------- */
.backdrop{position:fixed;inset:0;z-index:50;background:var(--shade);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);display:flex;align-items:flex-end;justify-content:center;animation:fade .22s ease both}
.backdrop.closing{animation:fadeout .2s ease both}
@keyframes fade{from{opacity:0}}
@keyframes fadeout{to{opacity:0}}
.sheet{width:100%;max-width:560px;max-height:90vh;overflow:auto;overscroll-behavior:contain;background:var(--panel);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));animation:sheetin .38s var(--spring) both;box-shadow:var(--shadow-md)}
.backdrop.closing .sheet{animation:sheetout .2s ease both}
@keyframes sheetin{from{transform:translateY(40px);opacity:.4}}
@keyframes sheetout{to{transform:translateY(30px);opacity:0}}
@media(min-width:640px){
  .backdrop{align-items:center;padding:24px}
  .sheet{border-radius:22px}
  @keyframes sheetin{from{transform:translateY(16px) scale(.98);opacity:0}}
  @keyframes sheetout{to{transform:translateY(10px) scale(.98);opacity:0}}
}
.sheet h3{font-size:17px;margin-bottom:16px}
.sheet-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.sheet.wide{max-width:780px;padding:0;display:flex;flex-direction:column;height:94vh;max-height:94vh;overflow:hidden}
@media(min-width:640px){.sheet.wide{height:auto;max-height:92vh}}
.sheet-head{display:flex;align-items:center;gap:10px;padding:16px 20px 12px;border-bottom:1px solid var(--line)}
.sheet-head h3{margin:0;flex:1;min-width:0;font-family:var(--serif);font-size:20px}
.sheet-body{flex:1;overflow:auto;overscroll-behavior:contain;padding:16px 20px 8px}
.sheet-foot{display:flex;align-items:center;gap:8px;padding:12px 20px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel)}
.sheet-foot .grow{flex:1}
.data-actions{display:flex;flex-direction:column;gap:8px}
.data-actions .btn{justify-content:flex-start}
.hint{font-size:12.5px;color:var(--haze);margin:12px 0 0;line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-md);transition:opacity .3s ease,transform .35s var(--spring);z-index:80;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.lightbox{position:fixed;inset:0;z-index:90;background:rgba(5,8,16,.9);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));animation:fade .2s ease both;cursor:zoom-out;overflow:auto}
.lightbox img{max-width:100%;max-height:100%;border-radius:10px;background:var(--img-bg);animation:sheetin .35s var(--spring) both}

/* ---------- grades ---------- */
.subject{padding:15px 16px 14px 18px}
.subject::before{background:var(--hc,var(--ice))}
.subject-head{display:flex;align-items:center;gap:4px;margin-bottom:12px}
.subject-title{flex:1;min-width:0;width:0;background:transparent;border:1px solid transparent;border-radius:8px;padding:5px 8px;font-size:16.5px;font-weight:700;letter-spacing:-.01em}
.subject-title:hover{border-color:var(--line)}
.subject-title:focus{background:var(--panel2);border-color:var(--ice)}
.gtable{display:grid;grid-template-columns:minmax(0,1fr) 44px 60px 60px 52px 26px;gap:7px 8px;align-items:center;margin-bottom:9px}
.g-h{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--haze)}
.g-h.r,.g-cell.r{text-align:right}
.g-cell{font-size:13px;color:var(--haze)}
.g-cell.pct{color:var(--ink);font-weight:650}
.gtable select,.gtable input{padding:7px 9px;font-size:13px;border-radius:8px;min-width:0}
.gtable select{padding-right:24px;background-position:right 8px center}
.gtable input[type=number]{text-align:right;font-family:var(--mono)}
.g-x{width:26px;height:26px;border-radius:7px;color:var(--haze);display:grid;place-items:center;flex:none;transition:color .15s,background .15s}
.g-x:hover{color:var(--late);background:var(--panel2)}
.subject-foot{display:flex;align-items:center;gap:14px;border-top:1px solid var(--line);margin-top:12px;padding-top:13px}
.gauge{flex:none;position:relative;width:58px;height:58px}
.gauge svg{display:block;transform:rotate(-90deg)}
.gauge .track{stroke:var(--panel2)}
.gauge .val{transition:stroke-dashoffset .6s var(--ease),stroke .3s}
.gauge .g-num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:12.5px;font-weight:700}
.foot-text{flex:1;min-width:0}
.foot-text .big{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.foot-text .sub{font-size:12px}
.empty{border:1.5px dashed var(--line);border-radius:var(--r-lg);padding:30px 20px;text-align:center;color:var(--haze);font-size:14px;line-height:1.6}
.empty b{color:var(--ink)}
.empty .btn{margin-top:12px}

/* ---------- daily checklist ---------- */
.dsubject{padding:12px 14px 12px 18px}
.dsubject::before{background:color-mix(in srgb,var(--hc,var(--line)) 70%,var(--line))}
.dsubject.s-done::before{background:var(--ok)}
.subs{margin:9px 0 0 32px;display:flex;flex-direction:column;gap:7px}
.sub-row{display:flex;align-items:center;gap:9px}
.sub-row .tick input{width:18px;height:18px;border-radius:6px}
.sub-row .sname{flex:1;font-size:13.5px;color:var(--ink)}
.sub-row.done .sname{color:var(--haze);text-decoration:line-through}
.sub-add{display:flex;gap:7px;margin:9px 0 0 32px}
.sub-add input{padding:7px 10px;font-size:13px;border-radius:8px}
.rem-section{margin-bottom:16px}
.rem-row{padding:11px 14px 11px 18px}
.rem-row .item{align-items:center}
.rem-row h3{font-size:14px;font-weight:600}
.rem-row .rname{font-size:12px;color:var(--haze);margin-top:1px}

/* ---------- account & sync ---------- */
.acct-form{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
.acct-row{display:flex;gap:8px}
.acct-row .btn{flex:1;justify-content:center}
.sync-status{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--haze)}

/* ---------- home ---------- */
.greet{margin:10px 0 20px}
.greet h1{font-family:var(--serif);font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.greet p{margin:6px 0 0;color:var(--haze);font-size:14px}
.launch-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-bottom:22px}
.launch{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;padding:20px 20px 18px;border-radius:22px;background:var(--panel);border:1px solid var(--line);text-align:left;transition:transform .3s var(--ease),box-shadow .3s ease,border-color .3s ease;min-height:210px}
.launch::after{content:"";position:absolute;right:-90px;bottom:-110px;width:280px;height:280px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--hc) 20%,transparent),transparent);pointer-events:none;transition:transform .6s var(--ease)}
@media (hover:hover){
  .launch:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:color-mix(in srgb,var(--hc) 45%,var(--line))}
  .launch:hover::after{transform:scale(1.18) translate(-10px,-10px)}
  .launch:hover .go{transform:translateX(4px);color:var(--hc)}
}
.launch:active{transform:scale(.985)}
.launch-icon{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:var(--hc);background:color-mix(in srgb,var(--hc) 14%,transparent);margin-bottom:8px}
.launch h2{font-family:var(--serif);font-size:24px;letter-spacing:-.015em}
.launch p{color:var(--haze);font-size:13.5px;margin:0;line-height:1.5}
.launch .go{position:absolute;top:22px;right:20px;color:var(--haze);transition:transform .3s var(--ease),color .3s}
.launch-stats{display:flex;gap:22px;margin-top:auto;padding-top:14px;border-top:1px solid var(--line);position:relative;z-index:1}
.stat b{display:block;font-family:var(--mono);font-size:21px;font-weight:700;color:var(--ink);line-height:1.15}
.stat b.late{color:var(--late)} .stat b.ok{color:var(--ok)}
.stat span{font-size:11.5px;color:var(--haze)}
.mini{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);transition:border-color .2s,box-shadow .2s,transform .25s var(--ease);text-align:left;width:100%}
@media (hover:hover){.mini:hover{border-color:color-mix(in srgb,var(--hc,var(--ice)) 40%,var(--line));box-shadow:var(--shadow-sm);transform:translateX(2px)}}
.mini .bar{width:3px;align-self:stretch;border-radius:3px;background:var(--hc,var(--line));flex:none}
.mini .mt{flex:1 1 140px;min-width:0}
.mini{flex-wrap:wrap;row-gap:8px}
.mini .due-chip{margin-left:auto;flex:none}
.mini .mt b{display:block;font-size:14px;font-weight:650}
.mini .mt>span{display:block;font-size:12px;color:var(--haze)}
.home-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.home-cols>div{min-width:0}
.home-cols .stack{gap:8px}
.topic-cloud{display:flex;flex-wrap:wrap;gap:7px}

/* ---------- error log ---------- */
.chiprow{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 10px;padding:2px 16px 4px;scroll-padding:16px}
.chiprow::-webkit-scrollbar{display:none}
.fchip{flex:none;max-width:100%;display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13px;font-weight:600;color:var(--haze);transition:color .2s ease,background .2s ease,border-color .2s ease,transform .2s var(--ease);white-space:nowrap}
.fchip .dot{width:8px;height:8px;border-radius:50%;background:var(--hc,var(--haze));flex:none}
.fchip .n{font-family:var(--mono);font-size:11px;opacity:.75}
.fchip:hover{color:var(--ink);border-color:color-mix(in srgb,var(--hc,var(--ice)) 45%,var(--line))}
.fchip:active{transform:scale(.96)}
.fchip.on{color:var(--hc,var(--ink));background:color-mix(in srgb,var(--hc,var(--ice)) 14%,var(--panel));border-color:color-mix(in srgb,var(--hc,var(--ice)) 50%,transparent)}
.fchip.small{padding:5px 10px;font-size:12px}
.ecard{cursor:pointer;padding:14px 16px 13px 20px}
.ecard .chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ecard .src{font-size:12px;color:var(--haze);margin-left:2px}
.ecard .preview{margin-top:9px;display:flex;gap:12px;align-items:flex-start}
.ecard .ptext{flex:1;min-width:0;font-size:14.5px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink)}
.ecard .ptext.muted{color:var(--haze);font-style:italic}
.ecard .pthumb{flex:none;width:84px;height:62px;border-radius:9px;overflow:hidden;border:1px solid var(--line);background:var(--img-bg)}
.ecard .pthumb img{width:100%;height:100%;object-fit:cover;object-position:left top;display:block}
.efoot{margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--haze)}
.efoot .grow{flex:1}
.dots{display:inline-flex;gap:4px;align-items:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:background .3s}
.dots i.on{background:var(--ok)}
.mastered-tag{color:var(--ok);font-weight:650}

.rich{font-size:15px;line-height:1.62;overflow-wrap:anywhere}
.rich p{margin:0 0 .55em}
.rich p:last-child{margin-bottom:0}
.rich .katex{font-size:1.06em}
.rich .katex-display{margin:.55em 0;overflow-x:auto;overflow-y:hidden;padding:3px 0}
.rich .katex-display>.katex{white-space:nowrap}
.rich .tex-raw{font-family:var(--mono);font-size:.9em;color:var(--warn)}
.b-img{margin:.5em 0}
.b-img img{display:block;max-width:100%;height:auto;border-radius:10px;border:1px solid var(--line);background:var(--img-bg);cursor:zoom-in;transition:transform .25s var(--ease),box-shadow .25s}
@media (hover:hover){.b-img img:hover{box-shadow:var(--shadow-md)}}
.img-missing{display:grid;place-items:center;min-height:90px;border:1.5px dashed var(--line);border-radius:10px;color:var(--haze);font-size:12.5px;padding:14px;text-align:center}
img[data-media]:not([src]){min-height:80px;min-width:80px;background:var(--panel2)}

.esec{margin-bottom:16px}
.esec-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--haze);margin:0 0 7px;display:flex;align-items:center;gap:8px}
.esec-label::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--hc,var(--haze))}
.ebox{border:1px solid var(--line);border-radius:14px;padding:13px 15px;background:var(--panel)}
.esec.stim .ebox{background:color-mix(in srgb,var(--panel2) 55%,var(--panel))}
.esec.mine{--hc:var(--late)} .esec.mine .ebox{border-left:3px solid var(--late);background:color-mix(in srgb,var(--late) 5%,var(--panel))}
.esec.right{--hc:var(--ok)} .esec.right .ebox{border-left:3px solid var(--ok);background:color-mix(in srgb,var(--ok) 5%,var(--panel))}
.esec.notes{--hc:var(--warn)} .esec.notes .ebox{border-left:3px solid var(--warn)}
.detail-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:16px}
.history{display:flex;gap:4px;flex-wrap:wrap}
.history i{width:10px;height:10px;border-radius:3px;background:var(--late)}
.history i.ok{background:var(--ok)}

/* editor */
.ed-meta{margin-bottom:6px}
.ed-sec{border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;margin-bottom:12px;background:color-mix(in srgb,var(--panel2) 35%,var(--panel));transition:border-color .2s ease,background .2s ease,box-shadow .2s ease}
.ed-sec.focus{border-color:color-mix(in srgb,var(--ice) 45%,var(--line))}
.ed-sec.drag{border-color:var(--ice);background:color-mix(in srgb,var(--ice) 9%,var(--panel));box-shadow:0 0 0 3px color-mix(in srgb,var(--ice) 18%,transparent)}
.ed-head{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.ed-head h4{font-size:13.5px;font-weight:700;letter-spacing:-.005em;flex:1;display:flex;align-items:center;gap:8px}
.ed-head h4::before{content:"";width:8px;height:8px;border-radius:3px;background:var(--hc,var(--haze))}
.ed-head .opt{font-weight:500;color:var(--haze);font-size:12px}
.ed-sec.q{--hc:var(--ice)} .ed-sec.mine{--hc:var(--late)} .ed-sec.right{--hc:var(--ok)} .ed-sec.notes{--hc:var(--warn)} .ed-sec.stim{--hc:var(--haze)}
.blk{position:relative;margin-bottom:8px;border-radius:11px;background:var(--panel);border:1px solid var(--line);padding:7px 8px 8px}
.blk-bar{display:flex;align-items:center;gap:1px;margin-bottom:5px}
.blk-type{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--haze);flex:1;padding-left:3px}
.blk-bar .icon-btn{width:26px;height:26px;border-radius:7px}
.blk textarea{min-height:58px;background:var(--panel2);font-size:14.5px}
.blk.math textarea{font-family:var(--mono);font-size:13px;min-height:46px}
.blk-prev{margin-top:7px;padding:9px 11px;border-radius:8px;background:color-mix(in srgb,var(--panel2) 60%,transparent);border:1px dashed var(--line);font-size:14.5px;overflow-x:auto}
.blk-prev:empty{display:none}
.blk-img{display:flex;justify-content:center;background:var(--img-bg);border-radius:8px;padding:4px}
.blk-img img{max-width:100%;max-height:280px;border-radius:6px;display:block}
.ed-add{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ed-add .btn{padding:6px 10px;font-size:12.5px;border-radius:9px}
.ed-add .hint{margin:0 0 0 4px;font-size:11.5px}
.add-stim{width:100%;border:1.5px dashed var(--line);border-radius:14px;padding:11px;color:var(--haze);font-size:13px;font-weight:600;margin-bottom:12px;transition:border-color .2s,color .2s,background .2s}
.add-stim:hover{border-color:var(--ice);color:var(--ink);background:color-mix(in srgb,var(--ice) 5%,transparent)}
.tex-help{font-size:12px;color:var(--haze);line-height:1.6;margin:2px 0 14px;padding:10px 12px;border-radius:10px;background:var(--panel2)}
.tex-help summary{cursor:pointer;font-weight:650;color:var(--ink);list-style:none}
.tex-help summary::-webkit-details-marker{display:none}
.tex-help summary::after{content:" +";color:var(--haze)}
.tex-help[open] summary::after{content:""}
.tex-help[open] summary{margin-bottom:4px}
.tex-help code{font-family:var(--mono);font-size:11.5px;color:var(--ink);background:var(--panel);padding:1px 5px;border-radius:5px;border:1px solid var(--line)}

/* drill */
.drill-setup .scope{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:18px}
.scope-card{position:relative;display:flex;flex-direction:column;gap:4px;padding:14px 14px 13px 18px;border-radius:16px;background:var(--panel);border:1px solid var(--line);text-align:left;transition:border-color .2s,box-shadow .2s,transform .25s var(--ease)}
.scope-card::before{content:"";position:absolute;left:7px;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--hc,var(--ice))}
@media (hover:hover){.scope-card:hover{border-color:color-mix(in srgb,var(--hc,var(--ice)) 45%,var(--line));box-shadow:var(--shadow-sm);transform:translateY(-2px)}}
.scope-card:active{transform:scale(.98)}
.scope-card:disabled{opacity:.45;transform:none;box-shadow:none;cursor:default}
.scope-card b{font-size:14.5px;font-weight:650}
.scope-card span{font-size:12px;color:var(--haze)}
.drill-top{display:flex;align-items:center;gap:12px;margin:2px 0 14px}
.prog{flex:1;height:6px;border-radius:6px;background:var(--panel2);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ice),var(--ok));border-radius:6px;transition:width .5s var(--ease)}
.drill-count{font-family:var(--mono);font-size:12px;color:var(--haze);white-space:nowrap}
.drill-card{padding:18px 18px 18px 22px;animation:cardin .42s var(--spring) both}
@keyframes cardin{from{opacity:0;transform:translateX(18px)}}
.drill-card .chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px}
.reveal-area{animation:reveal .45s var(--ease) both}
@keyframes reveal{from{opacity:0;transform:translateY(10px)}}
.grade-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:16px}
.grade-row .btn{min-width:0;padding-left:10px;padding-right:10px}
.attempt textarea{min-height:70px}
details.orig{margin:4px 0 14px}
details.orig summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--haze);padding:6px 0;list-style:none;display:flex;align-items:center;gap:6px}
details.orig summary::-webkit-details-marker{display:none}
details.orig summary::before{content:"";width:6px;height:6px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(-45deg);transition:transform .2s}
details.orig[open] summary::before{transform:rotate(45deg)}
.summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:6px 0 18px}
.summary-grid .stat{padding:14px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}

/* subjects manager */
.msub{padding:14px 14px 12px 20px}
.msub-head{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.msub-head .subject-title{font-family:var(--serif);font-size:18px}
.swatches{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 12px 8px}
.sw{width:20px;height:20px;border-radius:50%;background:var(--hc);border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);transition:transform .18s var(--spring),box-shadow .18s}
.sw:hover{transform:scale(1.15)}
.sw.on{box-shadow:0 0 0 2px var(--hc)}
.mtopics{display:flex;flex-direction:column;gap:5px;margin-left:8px}
.mtopic{display:flex;align-items:center;gap:6px;padding:3px 4px 3px 8px;border-radius:10px;transition:background .2s}
.mtopic:hover{background:var(--panel2)}
.mtopic .tdot{width:12px;height:12px;border-radius:50%;background:var(--hc);flex:none;border:2px solid var(--panel);box-shadow:0 0 0 1px color-mix(in srgb,var(--hc) 60%,transparent);transition:transform .2s var(--spring)}
.mtopic .tdot:hover{transform:scale(1.25)}
.mtopic input{flex:1;min-width:0;background:transparent;border:1px solid transparent;padding:5px 7px;font-size:13.5px;border-radius:7px}
.mtopic input:hover{border-color:var(--line)}
.mtopic input:focus{background:var(--panel);border-color:var(--ice)}
.mtopic .cnt{font-family:var(--mono);font-size:11px;color:var(--haze);min-width:18px;text-align:right}
.mtopic .icon-btn{width:26px;height:26px;border-radius:7px}
.madd{display:flex;gap:7px;margin:8px 0 2px 8px}
.madd input{padding:7px 10px;font-size:13px;border-radius:8px}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px}
.setting-row .seg{margin:0;flex:none;min-width:170px}

/* ---------- motion ---------- */
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes pop{from{opacity:0;transform:scale(.97)}}
.view-enter>*{animation:rise .42s var(--ease) both}
.view-enter>*:nth-child(2){animation-delay:.03s}
.view-enter>*:nth-child(3){animation-delay:.06s}
.view-enter>*:nth-child(4){animation-delay:.09s}
.view-enter>*:nth-child(n+5){animation-delay:.12s}
.view-enter .stack>*{animation:rise .45s var(--ease) both}
.view-enter .stack>*:nth-child(2){animation-delay:.04s}
.view-enter .stack>*:nth-child(3){animation-delay:.07s}
.view-enter .stack>*:nth-child(4){animation-delay:.10s}
.view-enter .stack>*:nth-child(5){animation-delay:.13s}
.view-enter .stack>*:nth-child(n+6){animation-delay:.16s}
.pop-in{animation:pop .32s var(--ease) both}

@media(min-width:641px){.chiprow{flex-wrap:wrap;overflow:visible;margin:0 0 10px;padding:2px 0 4px}}
@media(max-width:820px){.home-cols{grid-template-columns:minmax(0,1fr)}}
.brand{min-width:0}
.crumb{white-space:nowrap;overflow:hidden;min-width:0}
@media(max-width:360px){
  .top-row{gap:6px}
  body:not([data-app=home]) .brand>span:first-of-type{display:none}
  body:not([data-app=home]) .crumb::before{display:none}
}
@media(max-width:640px){
  .launch-grid,.home-cols{grid-template-columns:minmax(0,1fr)}
  .launch{min-height:0}
}
@media(max-width:430px){
  .hud{display:none}
  .crumb{font-size:14px}
  .gtable{grid-template-columns:minmax(0,1fr) 36px 52px 52px 46px 24px;gap:6px}
  .gtable select,.gtable input{font-size:12px;padding:6px 7px}
  .gtable select{padding-right:20px}
  .g-cell{font-size:12px}
  .f-row{grid-template-columns:1fr}
  .f-row.three{grid-template-columns:minmax(0,1fr) 84px}
  .f-row.three>.f-block:last-child{grid-column:1/-1}
  .tabs>button{position:relative}
  .tabs .badge{position:absolute;top:4px;right:5px;min-width:8px;width:8px;height:8px;padding:0;font-size:0}
  .tabs>button{font-size:12px;padding:8px 2px;gap:4px}
  .panel-head h2{font-size:24px}
  .greet h1{font-size:28px}
  .summary-grid{grid-template-columns:1fr 1fr 1fr;gap:7px}
  .summary-grid .stat{padding:11px}
  .ecard .pthumb{width:66px;height:52px}
  .mtopic [data-action=elt-move]{display:none}
  .mtopic input{font-size:13px}
  .msub{padding-right:10px}
}
.seg.no-anim::before{transition:none}
/* ---------- scrolling text ----------
   Titles and labels stay on one line inside a fixed-width box. If the text
   is longer than the box, it fades at the edge and glides across, Apple Music
   style: rest, ease across, rest again, loop seamlessly. */
.title-row h3,.quick-row h3,.rem-row h3,.rem-row .rname,.sub-row .sname,.klass .kt,.chip:not(.due-chip),.fchip .lbl,.divider-label .lbl,.mini .mt b,.mini .mt>span,.sheet-head h3,.scope-card b,.scope-card>span,.ecard .src,.efoot .st,.launch h2,.greet h1,.panel-head h2{white-space:nowrap;overflow:hidden;min-width:0;max-width:100%}
.title-row h3,.divider-label .lbl,.efoot .st,.ecard .src{flex:0 1 auto}
.fchip .lbl{display:block;max-width:13rem;flex:0 1 auto}
.chip:not(.due-chip){max-width:min(100%,18rem)}
.klass::before,.divider-label .dot,.fchip .dot{flex:none}
/* phones: titles get the full card width; countdown and buttons drop to the second row */
@media(max-width:520px){
  .card:not(.dsubject) .item:has(>.item-side){display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:11px;align-items:start}
  .card:not(.dsubject) .item:has(>.item-side)>.tick{grid-column:1;grid-row:1}
  .card:not(.dsubject) .item:has(>.item-side)>.item-main{display:contents}
  .card:not(.dsubject) .item:has(>.item-side) .title-row{grid-column:2/4;grid-row:1;padding-top:1px}
  .card:not(.dsubject) .item:has(>.item-side) .meta{grid-column:2;grid-row:2;margin-top:6px}
  .card:not(.dsubject) .item:has(>.item-side) .details{grid-column:2/4;grid-row:3}
  .card:not(.dsubject) .item:has(>.item-side)>.item-side{grid-column:3;grid-row:2;margin-top:6px}
}
.divider-label .lbl{display:block}
.mq-on{text-overflow:clip!important;justify-content:flex-start!important;text-align:left!important;--mq-r:18px;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 var(--mq-l,0px),#000 calc(100% - var(--mq-r)),transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 var(--mq-l,0px),#000 calc(100% - var(--mq-r)),transparent 100%)}
.mq-track{display:inline-flex;white-space:nowrap;vertical-align:top;will-change:transform}
.mq-a{flex:none}
.done .title-row h3 .mq-a,.quick-row.done h3 .mq-a,.sub-row.done .sname .mq-a{text-decoration:line-through;text-decoration-thickness:1.5px}

</style>

<body>

<header class="top">
  <div class="top-row">
    <button class="icon-btn" id="home-btn" data-action="go" data-to="home" title="Home" aria-label="Home" hidden></button>
    <button class="brand" data-action="go" data-to="home" aria-label="Orbit home">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="9" stroke="var(--ice)" stroke-width="2"/>
        <circle cx="12" cy="12" r="3.4" fill="var(--ice)"/>
        <circle cx="18.4" cy="5.6" r="2.1" fill="var(--bg)"/>
        <circle cx="18.4" cy="5.6" r="1.4" fill="var(--ice)"/>
      </svg>
      <span>Orbit</span><span class="crumb" id="crumb"></span>
    </button>
    <div class="hud" id="hud"></div>
    <button class="icon-btn" id="theme-btn" title="Switch theme" aria-label="Switch theme"></button>
    <button class="icon-btn" data-action="data-menu" title="Account and backup" aria-label="Account and backup">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6"/><path d="M4 11.5v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6"/></svg>
    </button>
  </div>
  <nav class="tabs seg" id="tabs" role="tablist" aria-label="Sections" hidden></nav>
</header>

<main id="view"></main>
<div id="modal-root"></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>
<input type="file" id="img-file" accept="image/*" multiple hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/katex/contrib/mhchem.min.js"></script>

<script>
(function(){
'use strict';

/* ================= storage ================= */
var KEY='orbit.v1';
var memStore=null;
function readRaw(){ try{ return localStorage.getItem(KEY); }catch(e){ return memStore; } }
function writeRaw(v){ try{ localStorage.setItem(KEY,v); }catch(e){ memStore=v; } }

function defaultDaily(){
  function subj(n,c){ return {id:uid(),name:n,curr:c,done:false,subs:[]}; }
  return {
    curriculum:'HSC', mode:'homework', lastReset:todayStr(), reminderDone:{},
    homework:[
      subj('Chemistry',['HSC','AL']), subj('Physics',['HSC','AL']), subj('Math',['HSC','AL']),
      subj('English',['HSC']), subj('SOR',['HSC']), subj('VA',['HSC'])
    ],
    projects:[]
  };
}
function defaultUI(curr){ return {app:'home',tab:'assignments',taskMode:'quick',etab:'log',drillOrder:'oldest',el:{curr:curr||'HSC',sub:'all',topic:'all',status:'active',q:''}}; }
function blank(){ return {assignments:[],quick:[],tasks:[],subjects:[],daily:defaultDaily(),errlog:defaultErrlog(),theme:null,updatedAt:null,pAt:null,ui:defaultUI()}; }
/* fills in anything missing, so data saved by older versions keeps working */
function normalizeState(p){
  if(!p || typeof p!=='object') p={};
  var b=blank();
  for(var k in b){ if(p[k]===undefined) p[k]=b[k]; }
  ['assignments','quick','tasks','subjects'].forEach(function(k){ if(!Array.isArray(p[k])) p[k]=[]; });
  if(!p.daily || typeof p.daily!=='object') p.daily=defaultDaily();
  if(!p.ui || typeof p.ui!=='object') p.ui={};
  var du=defaultUI(p.daily.curriculum==='AL'? 'AL' : 'HSC');
  for(var u in du){ if(p.ui[u]===undefined) p.ui[u]=du[u]; }
  if(!p.ui.el || typeof p.ui.el!=='object') p.ui.el=du.el;
  for(var q in du.el){ if(p.ui.el[q]===undefined) p.ui.el[q]=du.el[q]; }
  if(p.ui.el.curr!=='HSC' && p.ui.el.curr!=='AL') p.ui.el.curr='HSC';
  p.errlog=normErrlog(p.errlog);
  return p;
}
function load(){
  try{ var raw=readRaw(); return normalizeState(raw? JSON.parse(raw) : null); }
  catch(e){ return blank(); }
}
var S=load();
/* save(): planner change. save('e'): error log change. save('both'). save('ui'): view state only, never synced or timestamped */
function save(sec){
  if(sec!=='ui'){
    var now=new Date().toISOString();
    S.updatedAt=now;
    if(sec==='e'||sec==='both') S.errlog.at=now;
    if(sec!=='e') S.pAt=now;
  }
  writeRaw(JSON.stringify(S));
  if(sec!=='ui') scheduleSync();
}

/* ================= utils ================= */
function uid(){ try{ return crypto.randomUUID(); }catch(e){ return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9); } }
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function todayMid(){ var d=new Date(); d.setHours(0,0,0,0); return d; }
function parseD(s){ if(!s) return null; var p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function fmtD(s){ var d=parseD(s); return d? d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'}) : ''; }
function todayStr(){ var d=new Date(); function p(n){return String(n).padStart(2,'0');} return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }

function fmtT(t){
  if(!t) return '';
  var p=t.split(':'), d=new Date(2000,0,1,+p[0]||0,+p[1]||0);
  return d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
}
function pad2(n){ return String(n).padStart(2,'0'); }

/* diff = calendar days from today until due (negative = past) */
function dueDiff(item){ if(!item.dueDate) return null; return Math.round((parseD(item.dueDate)-todayMid())/864e5); }
/* exact due moment: the due time if set, otherwise the very end of the due day */
function dueMs(item){
  if(!item.dueDate) return null;
  var d=parseD(item.dueDate);
  if(item.dueTime){ var p=item.dueTime.split(':'); d.setHours(+p[0]||0,+p[1]||0,0,0); }
  else d.setHours(23,59,59,999);
  return d.getTime();
}
function isOverdue(item,now){ var m=dueMs(item); return m!==null && !item.completed && (now||Date.now())>m; }
function overdueDays(item){ var d=dueDiff(item); return d===null? 0 : Math.abs(Math.min(d,0)); }

function statusClass(item,now){
  if(item.completed) return 'done';
  var d=dueDiff(item);
  if(d===null) return '';
  if(isOverdue(item,now)) return 's-late';
  if(d===0) return 's-today';
  if(d<=7) return 's-soon';
  return '';
}
function cdParts(ms){
  var s=Math.max(0,Math.floor(ms/1000));
  return {d:Math.floor(s/86400), h:Math.floor(s%86400/3600), m:Math.floor(s%3600/60), s:s%60};
}
/* countdown text + tint for any dated item; precision rises as the deadline gets closer */
function countdownInfo(item,now){
  now=now||Date.now();
  if(item.completed) return {t:'Done', c:'tint-ok'};
  var m=dueMs(item);
  if(m===null) return {t:'No due date', c:''};
  var r=m-now, p;
  if(r<0){
    var od=overdueDays(item);
    if(od>=1) return {t:'Overdue '+od+'d', c:'tint-late'};
    p=cdParts(-r);
    return {t:'Overdue '+(p.h? p.h+'h ':'')+p.m+'m', c:'tint-late'};
  }
  p=cdParts(r);
  var t = p.d>=7 ? p.d+'d '+p.h+'h'
        : p.d>=1 ? p.d+'d '+pad2(p.h)+'h '+pad2(p.m)+'m'
        : pad2(p.h)+'h '+pad2(p.m)+'m '+pad2(p.s)+'s';
  var d=dueDiff(item);
  return {t:t+' left', c: d===0? 'tint-warn' : d<=7? 'tint-ice' : ''};
}
function dueChip(item){
  var i=countdownInfo(item);
  var live=!item.completed && !!item.dueDate;
  return '<span class="chip due-chip '+i.c+'"'+(live? ' data-cd="'+esc(item.id)+'"':'')+'>'+esc(i.t)+'</span>';
}
function dueMeta(item){
  return item.dueDate? '<span>Due '+esc(fmtD(item.dueDate))+(item.dueTime? ', '+esc(fmtT(item.dueTime)):'')+'</span>' : '';
}
function prioChip(p){
  if(p==='High') return '<span class="chip tint-late">High</span>';
  if(p==='Medium') return '<span class="chip tint-warn">Medium</span>';
  return '<span class="chip tint-ok">Low</span>';
}
function sortByDue(list){
  var BIG=8.64e15;
  return list.slice().sort(function(a,b){
    if(!!a.completed!==!!b.completed) return a.completed?1:-1;
    var da=a.dueDate?dueMs(a):BIG;
    var db=b.dueDate?dueMs(b):BIG;
    if(da!==db) return da-db;
    return String(a.name).localeCompare(String(b.name));
  });
}
function classList(){
  var s={};
  S.assignments.concat(S.tasks).forEach(function(x){ if(x.klass) s[x.klass]=1; });
  return Object.keys(s).sort();
}

/* ================= grades maths ================= */
function letterFor(p){
  if(p>=85) return 'A';
  if(p>=70) return 'B';
  if(p>=55) return 'C';
  if(p>=50) return 'D';
  return 'Fail';
}
function letterTint(L){ return L==='A'?'tint-ok':L==='B'?'tint-ice':L==='C'?'tint-warn':L==='D'?'tint-d':'tint-late'; }
function rowPct(r){
  if(r.mark===null||r.mark===undefined||r.mark==='') return null;
  var t=Number(r.total), m=Number(r.mark);
  if(!isFinite(t)||t<=0||!isFinite(m)) return null;
  return (m/t)*100;
}
function rowWeight(r){
  var a=S.assignments.find(function(x){return x.id===r.assignmentId;});
  if(!a) return null;
  var w=Number(a.weighting);
  return isFinite(w)&&w>0? w : null;
}
function subjectFinal(sub){
  var sw=0, swp=0;
  sub.rows.forEach(function(r){
    var w=rowWeight(r), p=rowPct(r);
    if(w!==null&&p!==null){ sw+=w; swp+=w*p; }
  });
  return sw>0? {final:swp/sw, sumW:sw} : null;
}

/* ================= theme ================= */
function systemLight(){ try{ return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches; }catch(e){ return false; } }
var ICON={
  up:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>',
  down:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  sun:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.4"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7"/></svg>',
  moon:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A8.6 8.6 0 1 1 11.2 3a6.8 6.8 0 0 0 9.8 9.8z"/></svg>',
  edit:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>',
  trash:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>',
  x:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  plus:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'
};
function resolvedTheme(){ return S.theme || (systemLight()?'light':'dark'); }
function applyTheme(){
  var t=resolvedTheme();
  document.documentElement.dataset.theme=t;
  var m=document.querySelector('meta[name=theme-color]');
  if(m) m.content = t==='light' ? '#eef1f7' : '#0e1424';
  var b=$('#theme-btn'); if(b) b.innerHTML = t==='light' ? ICON.moon : ICON.sun;
}

/* ================= views ================= */
function assignmentCard(a){
  var meta=[];
  if(a.klass) meta.push('<span class="klass '+hcls(hueForName(a.klass))+'"><span class="kt">'+esc(a.klass)+'</span></span>');
  meta.push('<span>'+esc(a.assessType||'')+'</span>');
  if(a.weighting!==null&&a.weighting!==undefined&&a.weighting!=='') meta.push('<span class="num">'+esc(a.weighting)+'% weighting</span>');
  if(a.dateAssigned) meta.push('<span>Assigned '+esc(fmtD(a.dateAssigned))+'</span>');
  if(a.dueDate) meta.push(dueMeta(a));
  return '<article class="card '+statusClass(a)+'" data-cdcard="'+esc(a.id)+'">'+
    '<div class="item">'+
      '<label class="tick"><input type="checkbox" data-action="toggle-assignment" data-id="'+a.id+'"'+(a.completed?' checked':'')+' aria-label="Mark complete"></label>'+
      '<div class="item-main">'+
        '<div class="title-row"><h3>'+esc(a.name)+'</h3>'+prioChip(a.priority)+'</div>'+
        '<div class="meta">'+meta.join('')+'</div>'+
        (a.details? '<p class="details" data-action="expand">'+esc(a.details)+'</p>':'')+
      '</div>'+
      '<div class="item-side">'+dueChip(a)+
        '<div class="row-actions">'+
          '<button class="icon-btn" data-action="edit-assignment" data-id="'+a.id+'" title="Edit" aria-label="Edit">'+ICON.edit+'</button>'+
          '<button class="icon-btn" data-action="del-assignment" data-id="'+a.id+'" title="Delete" aria-label="Delete">'+ICON.trash+'</button>'+
        '</div>'+
      '</div>'+
    '</div>'+
  '</article>';
}

function viewAssignments(){
  var open=S.assignments.filter(function(a){return !a.completed;}).length;
  var late=S.assignments.filter(isOverdue).length;
  var h='<div class="panel-head"><div><div class="eyebrow">Assessment tracker</div><h2>Assignments</h2>'+
    '<p class="sub">'+open+' open'+(late? ' &middot; <b style="color:var(--late)">'+late+' overdue</b>':'')+'</p></div>'+
    '<button class="btn primary" data-action="new-assignment">'+ICON.plus+' New</button></div>';
  if(!S.assignments.length){
    h+='<div class="empty"><b>No assignments yet.</b><br>Add your first assessment and Orbit will track its due date, weighting and overdue status.</div>';
  }else{
    h+='<div class="stack">'+sortByDue(S.assignments).map(assignmentCard).join('')+'</div>';
  }
  return h;
}

function taskCard(t){
  var meta=[];
  if(t.klass) meta.push('<span class="klass '+hcls(hueForName(t.klass))+'"><span class="kt">'+esc(t.klass)+'</span></span>');
  meta.push('<span>'+esc(t.taskType||'')+'</span>');
  if(t.weighting!==null&&t.weighting!==undefined&&t.weighting!=='') meta.push('<span class="num">'+esc(t.weighting)+'% weighting</span>');
  if(t.dateAssigned) meta.push('<span>Assigned '+esc(fmtD(t.dateAssigned))+'</span>');
  if(t.dueDate) meta.push(dueMeta(t));
  return '<article class="card '+statusClass(t)+'" data-cdcard="'+esc(t.id)+'">'+
    '<div class="item">'+
      '<label class="tick"><input type="checkbox" data-action="toggle-task" data-id="'+t.id+'"'+(t.completed?' checked':'')+' aria-label="Mark complete"></label>'+
      '<div class="item-main">'+
        '<div class="title-row"><h3>'+esc(t.name)+'</h3>'+prioChip(t.priority)+'</div>'+
        '<div class="meta">'+meta.join('')+'</div>'+
        (t.details? '<p class="details" data-action="expand">'+esc(t.details)+'</p>':'')+
      '</div>'+
      '<div class="item-side">'+dueChip(t)+
        '<div class="row-actions">'+
          '<button class="icon-btn" data-action="edit-task" data-id="'+t.id+'" title="Edit" aria-label="Edit">'+ICON.edit+'</button>'+
          '<button class="icon-btn" data-action="del-task" data-id="'+t.id+'" title="Delete" aria-label="Delete">'+ICON.trash+'</button>'+
        '</div>'+
      '</div>'+
    '</div>'+
  '</article>';
}

function viewTasks(){
  var mode=S.ui.taskMode||'quick';
  var h='<div class="panel-head"><div><div class="eyebrow">To-do</div><h2>Tasks</h2>'+
    '<p class="sub">Quick checklist for right now, essential tasks for real work.</p></div>'+
    (mode==='essential'? '<button class="btn primary" data-action="new-task">'+ICON.plus+' New</button>':'')+
    '</div>';
  h+=segHTML('taskmode',[{v:'quick',label:'Quick checklist'},{v:'essential',label:'Essential tasks'}],mode,'taskmode','mode');

  if(mode==='quick'){
    h+='<div class="quick-add"><input type="text" id="quick-input" placeholder="Add a quick task and press return" autocomplete="off">'+
       '<button class="btn primary" data-action="quick-add">Add</button></div>';
    if(!S.quick.length){
      h+='<div class="empty"><b>Checklist is clear.</b><br>Drop in anything off the top of your head.</div>';
    }else{
      h+='<div class="stack">'+S.quick.map(function(q){
        return '<article class="card quick-row '+(q.done?'done':'')+'" data-k="q-'+q.id+'"><div class="item">'+
          '<label class="tick"><input type="checkbox" data-action="quick-toggle" data-id="'+q.id+'"'+(q.done?' checked':'')+' aria-label="Done"></label>'+
          '<div class="item-main"><h3>'+esc(q.name)+'</h3></div>'+
          '<button class="icon-btn" data-action="quick-del" data-id="'+q.id+'" title="Remove" aria-label="Remove">'+ICON.x+'</button>'+
        '</div></article>';
      }).join('')+'</div>';
      if(S.quick.some(function(q){return q.done;}))
        h+='<div style="margin-top:12px;text-align:right"><button class="btn ghost sm" data-action="clear-done">Clear completed</button></div>';
    }
  }else{
    if(!S.tasks.length){
      h+='<div class="empty"><b>No essential tasks.</b><br>Homework, study prep, projects: anything that deserves a due date lives here.</div>';
    }else{
      h+='<div class="stack">'+sortByDue(S.tasks).map(taskCard).join('')+'</div>';
    }
  }
  return h;
}

function assignmentOptions(selected){
  var opts='<option value="">Select assessment</option>';
  sortByDue(S.assignments).forEach(function(a){
    var w=(a.weighting!==null&&a.weighting!==undefined&&a.weighting!=='')? a.weighting+'%' : 'no weighting';
    opts+='<option value="'+a.id+'"'+(a.id===selected?' selected':'')+'>'+esc(a.name)+' ('+esc(a.klass||'no class')+', '+esc(w)+')</option>';
  });
  return opts;
}

function gaugeHTML(final){
  var C=2*Math.PI*24;
  var off=C*(1-Math.max(0,Math.min(100,final))/100);
  var L=letterFor(final);
  var col=L==='A'?'var(--ok)':L==='B'?'var(--ice)':L==='C'?'var(--warn)':L==='D'?'var(--dband)':'var(--late)';
  return '<div class="gauge" aria-hidden="true"><svg width="58" height="58" viewBox="0 0 58 58">'+
    '<circle class="track" cx="29" cy="29" r="24" fill="none" stroke-width="6"/>'+
    '<circle class="val" cx="29" cy="29" r="24" fill="none" stroke="'+col+'" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+C.toFixed(2)+'" stroke-dashoffset="'+off.toFixed(2)+'"/>'+
    '</svg><div class="g-num">'+Math.round(final)+'</div></div>';
}

function footHTML(sub){
  var f=subjectFinal(sub);
  if(!f) return '<div class="foot-text"><div class="big">Weighted grade</div><p class="sub">Pick assessments and enter marks to calculate.</p></div>';
  var L=letterFor(f.final);
  return gaugeHTML(f.final)+
    '<div class="foot-text"><div class="big"><span class="num">'+f.final.toFixed(1)+'%</span>'+
    '<span class="chip '+letterTint(L)+'">'+L+'</span></div>'+
    '<p class="sub">Weighted across <span class="num">'+f.sumW+'%</span> of assessment weighting entered.</p></div>';
}

/* ================= FLIP list animation =================

   slide every element from its old spot to its new one instead of snapping. */
function flipKey(el){ return el.dataset.k || (el.dataset.cdcard? 'cd-'+el.dataset.cdcard : null); }
function flipSnapshot(root){
  var m={};
  root.querySelectorAll('[data-k],[data-cdcard]').forEach(function(el){ var k=flipKey(el); if(k) m[k]=el.getBoundingClientRect(); });
  return m;
}
function flipPlay(root,first){
  if(!first) return;
  root.querySelectorAll('[data-k],[data-cdcard]').forEach(function(el){
    var k=flipKey(el); if(!k) return;
    var f=first[k];

    if(typeof el.animate!=='function') return;
    var l=el.getBoundingClientRect(), dx=f.left-l.left, dy=f.top-l.top;
    if(Math.abs(dx)<1 && Math.abs(dy)<1) return;
    el.animate([{transform:'translate('+dx+'px,'+dy+'px)'},{transform:'none'}],{duration:340,easing:'cubic-bezier(.2,.8,.2,1)'});
  });
}

/* ================= rich text: text with LaTeX =================
   Inline maths: $...$ or \(...\)   Display maths: $$...$$ or \[...\]
   \$ is a literal dollar sign. Inline $ follows Pandoc's rules (no space
   just inside the delimiters, closing $ not followed by a digit), so
   prices like "$500 and $200" stay plain text. */
function mathSegments(src){
  src=String(src==null?'':src);
  var out=[], i=0, n=src.length, buf='';
  function flush(){ if(buf){ out.push({t:'text',v:buf}); buf=''; } }
  while(i<n){
    var c=src.charAt(i), c1=src.charAt(i+1);
    if(c==='\\' && c1==='$'){ buf+='$'; i+=2; continue; }
    if(c==='\\' && (c1==='(' || c1==='[')){
      var close= c1==='('? '\\)' : '\\]', j=src.indexOf(close,i+2);
      if(j>-1){ flush(); out.push({t:'math',v:src.slice(i+2,j),d:c1==='['}); i=j+2; continue; }
    }
    if(c==='$'){
      if(c1==='$'){
        var j2=src.indexOf('$$',i+2);
        if(j2>i+2){ flush(); out.push({t:'math',v:src.slice(i+2,j2),d:true}); i=j2+2; continue; }
        buf+='$$'; i+=2; continue;
      }
      if(i+1<n && !/\s/.test(c1)){
        var k=i+1, found=-1;
        while(k<n){
          var ck=src.charAt(k);
          if(ck==='\\'){ k+=2; continue; }
          if(ck==='$'){ if(!/\s/.test(src.charAt(k-1)) && !/[0-9]/.test(src.charAt(k+1))) found=k; break; }
          if(ck==='\n' && src.charAt(k+1)==='\n') break;
          k++;
        }
        if(found>-1){ flush(); out.push({t:'math',v:src.slice(i+1,found),d:false}); i=found+1; continue; }
      }
      buf+='$'; i++; continue;
    }
    buf+=c; i++;
  }
  flush();
  return out;
}
var texCache={}, texCacheN=0;
function texHTML(tex,display){
  var key=(display?'D':'I')+tex;
  if(texCache[key]) return texCache[key];
  var html;
  if(window.katex && typeof window.katex.renderToString==='function'){
    try{ html=window.katex.renderToString(tex,{displayMode:!!display,throwOnError:false,strict:'ignore',trust:false}); }
    catch(e){ html='<span class="tex-raw">'+esc(tex)+'</span>'; }
  }else{
    html='<span class="tex-raw">'+esc(display?'$$'+tex+'$$':'$'+tex+'$')+'</span>';
  }
  if(texCacheN>800){ texCache={}; texCacheN=0; }
  texCache[key]=html; texCacheN++;
  return html;
}
function hasMath(src){ return mathSegments(src).some(function(s){ return s.t==='math'; }); }
/* compact=true renders display maths inline (used in list previews) */
function richHTML(src,compact){
  var segs=mathSegments(src), h='';
  segs.forEach(function(s){
    if(s.t==='math') h+=texHTML(s.v, compact? false : s.d);
    else h+=esc(s.v).replace(/\n{2,}/g,'</p><p>').replace(/\n/g,'<br>');
  });
  return '<p>'+h+'</p>';
}

/* ================= media store (IndexedDB, memory fallback) ================= */
var Media=(function(){
  var DBN='orbit-media', ST='media', dbp=null, mem={}, urls={};
  function open(){
    if(dbp) return dbp;
    dbp=new Promise(function(res){
      try{
        if(!window.indexedDB){ res(null); return; }
        var rq=indexedDB.open(DBN,1);
        rq.onupgradeneeded=function(){ rq.result.createObjectStore(ST,{keyPath:'id'}); };
        rq.onsuccess=function(){ res(rq.result); };
        rq.onerror=function(){ res(null); };
        rq.onblocked=function(){ res(null); };
      }catch(e){ res(null); }
    });
    return dbp;
  }
  function req(mode,fn){
    return open().then(function(db){
      if(!db){ var r0=fn(null); return (r0&&typeof r0==='object'&&('result' in r0))? r0.result : r0; }
      return new Promise(function(res,rej){
        var t=db.transaction(ST,mode), r=fn(t.objectStore(ST));
        t.oncomplete=function(){ res(r&&('result' in r)? r.result : undefined); };
        t.onerror=function(){ rej(t.error); }; t.onabort=function(){ rej(t.error); };
      });
    });
  }
  return {
    put:function(rec){ return req('readwrite',function(s){ if(!s){ mem[rec.id]=rec; return null; } return s.put(rec); }); },
    get:function(id){ return req('readonly',function(s){ if(!s) return {result:mem[id]}; return s.get(id); }); },
    del:function(id){
      if(urls[id]){ try{ URL.revokeObjectURL(urls[id]); }catch(e){} delete urls[id]; }
      return req('readwrite',function(s){ if(!s){ delete mem[id]; return null; } return s.delete(id); });
    },
    all:function(){ return req('readonly',function(s){ if(!s) return {result:Object.keys(mem).map(function(k){return mem[k];})}; return s.getAll(); }).then(function(r){ return r||[]; }); },
    clear:function(){ Object.keys(urls).forEach(function(k){ try{ URL.revokeObjectURL(urls[k]); }catch(e){} }); urls={}; return req('readwrite',function(s){ if(!s){ mem={}; return null; } return s.clear(); }); },
    url:function(id){
      if(urls[id]) return Promise.resolve(urls[id]);
      return this.get(id).then(function(rec){
        if(!rec||!rec.blob) return null;
        try{ urls[id]=URL.createObjectURL(rec.blob); }catch(e){ return null; }
        return urls[id];
      });
    }
  };
})();

function loadImg(file){
  return new Promise(function(res,rej){
    var u=URL.createObjectURL(file), im=new Image();
    im.onload=function(){ URL.revokeObjectURL(u); res(im); };
    im.onerror=function(){ URL.revokeObjectURL(u); rej(new Error('That file could not be read as an image')); };
    im.src=u;
  });
}
/* Screenshots get scaled to 1600px on the long side and stored as JPEG on a
   white background (so transparent PNGs don't turn black). Small images are kept as-is. */
var IMG_MAX=1600;
function ingestImage(file){
  if(!file || !/^image\//.test(file.type||'')) return Promise.reject(new Error('Only image files can be added'));
  return loadImg(file).then(function(img){
    var w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
    var scale=Math.min(1, IMG_MAX/Math.max(w,h,1));
    var keep= scale===1 && file.size<=450000 && /^image\/(png|jpeg|webp|gif)$/.test(file.type);
    var cw=Math.round(w*scale), ch=Math.round(h*scale);
    var p= keep? Promise.resolve(file) : new Promise(function(res){
      var c=document.createElement('canvas'); c.width=cw; c.height=ch;
      var x=c.getContext('2d'); x.fillStyle='#ffffff'; x.fillRect(0,0,cw,ch); x.drawImage(img,0,0,cw,ch);
      c.toBlob(function(b){ res(b||file); },'image/jpeg',0.84);
    });
    return p.then(function(blob){
      var rec={id:uid(),blob:blob,type:blob.type||'image/jpeg',w:cw,h:ch,synced:false,created:new Date().toISOString()};
      return Media.put(rec).then(function(){ return rec; });
    });
  });
}
function markMissing(img){
  var d=document.createElement('div'); d.className='img-missing';
  d.textContent=getSession()? 'Image not available yet. It will appear once the device that added it has synced.' : 'Image not on this device. Sign in to sync images between devices.';
  if(img.parentNode) img.parentNode.replaceChild(d,img);
}
function hydrateMedia(root){
  (root||document).querySelectorAll('img[data-media]:not([src])').forEach(function(img){
    var id=img.dataset.media;
    if(img.dataset.loading) return; img.dataset.loading='1';
    Media.url(id).then(function(u){
      if(u){ img.src=u; return; }
      return fetchRemoteMedia(id).then(function(u2){ if(u2) img.src=u2; else markMissing(img); });
    }).catch(function(){ markMissing(img); });
  });
}
function openLightbox(src){
  var lb=document.createElement('div'); lb.className='lightbox'; lb.setAttribute('role','dialog');
  lb.innerHTML='<img alt="">'; lb.firstChild.src=src;
  lb.addEventListener('click',function(){ lb.remove(); });
  document.body.appendChild(lb);

function blobToDataURL(b){ return new Promise(function(res,rej){ var r=new FileReader(); r.onload=function(){ res(r.result); }; r.onerror=function(){ rej(r.error); }; r.readAsDataURL(b); }); }
function dataURLToBlob(d){
  var m=/^data:([^;,]+)?(;base64)?,(.*)$/.exec(d||''); if(!m) return null;
  var type=m[1]||'application/octet-stream', raw=m[2]? atob(m[3]) : decodeURIComponent(m[3]);
  var a=new Uint8Array(raw.length); for(var i=0;i<raw.length;i++) a[i]=raw.charCodeAt(i);
  return new Blob([a],{type:type});
}
